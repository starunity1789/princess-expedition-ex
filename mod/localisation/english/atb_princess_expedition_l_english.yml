l_english:
 # Origin
 origin_atb_princess_expedition:0 "The Princesses' Expedition"
 origin_atb_princess_expedition_desc:0 "§RWARNING: All Ascension Paths besides ['concept_synthetic_ascension'] are disabled.§!\n\nOn a rich world, a rich nation unlocked advanced technology on its own - yet its homeworld remained divided, with unification nowhere in sight. Rather than wait, this enlightened autocracy chose to go first: the Emperor stayed behind to guard the homeworld, while his four daughters took the mobile fortress §YOrigin Fortress§! to a distant system they named §YOrigin's Reach§!, to lay new foundations for the Empire among the stars.\n\nBut the colonists who came with them could not adapt to their new home. An incurable illness spread through the fortress, and they can no longer bear children. To keep the expedition alive, the princesses decided that their people would carry on in synthetic bodies."
 origin_tooltip_atb_princess_expedition_effects:0 "- $INITIAL_POPS$ §G+900§!$NEW_LINE$- $SPECIES_TRAITS$ ['concept_pathogenic_genes']\n- Homeworld: §YOrigin Fortress§! (giant mobile habitat)$TABBED_NEW_LINE$- Size: £planetsize£ 25$TABBED_NEW_LINE$- Habitability: §G100%§!$TABBED_NEW_LINE$- District caps: Housing, Generator, Mining and Agriculture §G15§! each$TABBED_NEW_LINE$- ['concept_abandoned_cities', £blocker£ $concept_abandoned_cities$]: +2$TABBED_NEW_LINE$- ['concept_identity_repository',£building£ $concept_identity_repository$]$TABBED_NEW_LINE$- ['concept_abandoned_gene_clinic',£building£ $concept_abandoned_gene_clinic$]$TABBED_NEW_LINE$- Features: §Y$d_atb_fortress_core$§!, §Y$d_atb_star_sea_monument$§!, §Y$d_atb_sensor_array$§!, §Y$d_atb_elemental_seal_institute$§!$NEW_LINE$- Home system: §YOrigin's Reach§!, in a cluster beyond the galactic rim at 12 o'clock with a single hyperlane into the galaxy; the system holds an §Y$lgate_base$§! and a §Y$mega_shipyard_ruined$§!$NEW_LINE$- Situation: ['concept_identity_rescue']$NEW_LINE$- $ADDITIONAL_TECHNOLOGIES_STRING$ ['concept_synth_ai']$NEW_LINE$- $GUARANTEED_RESEARCH_OPTION_STRING$ ['concept_robotic_workers', £engineering_research£ $tech_robotic_workers$]$NEW_LINE$- §YThe four Princesses§! serve as Ruler, Minister of Defense, Head of Research and Minister of State: immortal, cannot be dismissed, no upkeep$NEW_LINE$- The §YFirst Princess§! is the Empire's §YLuminary§!: she lives through the Luminary's first and second acts, but she never ages, so there is no third act$NEW_LINE$- Relic: §Y$r_atb_princess_seal$§!$NEW_LINE$- After §YSynthetic Dawn§!, the Empire can establish the §Y$auth_atb_expedition$§!$NEW_LINE$- After researching the Archaeology Lab, the capital decision §Y$decision_atb_precursor_secrets$§! becomes available$NEW_LINE$- §YGray§! can always be found in the L-Cluster"
 origin_tooltip_atb_princess_expedition_negative_effects:0 "- £pop£ §HPops§!: Dying out$NEW_LINE$- The L-Cluster always holds the §RGray Tempest§!$NEW_LINE$- Dictatorial authority only"

 # System and planet
 atb_system_origin:0 "Origin's Reach"
 atb_planet_fortress:0 "Origin Fortress"
 pc_atb_fortress:0 "Mobile Fortress"
 pc_atb_fortress_plural:0 "Mobile Fortresses"
 pc_atb_fortress_desc:0 "A giant mobile habitat built with the full might of the Empire. It carried the princesses and their colonists across the stars and now makes its home in Origin's Reach. Its decks hold complete housing, power, mining and agricultural sectors, comfortable for any species."
 pc_atb_fortress_adj:0 "Fortress"
 pc_atb_fortress_tile:0 "Fortress Decks"
 pc_atb_fortress_tile_desc:0 "Layer upon layer of artificial decks, with the fortress engines and reactors below."

 # The four princesses
 atb_leader_name_filiruoya:0 "First Princess Filiruoya"
 atb_leader_name_yugudora:0 "Second Princess Yugudora"
 atb_leader_name_youfeilina:0 "Third Princess Youfeilina"
 atb_leader_name_antaixiya:0 "Fourth Princess Antaixiya"
 atb_leader_desc_filiruoya:0 "Commander of the expedition and eldest daughter of the Emperor. The crystal flowers and white feathers in her hair are her emblem, also carved on the seal of the Princess Guard. The Emperor placed that seal in her hands himself before she left."
 atb_leader_desc_yugudora:0 "The second princess, always in crimson. Legend says the goldfish swimming around her are elemental spirits made flesh. She commands the expedition's fleets, and their engines and guns answer to her will."
 atb_leader_desc_youfeilina:0 "The quiet third princess, wreathed in drifting shadowy mist. The Empire's finest scholar, she leads the effort to digitize her people's minds, and was the first to see the path to ascension."
 atb_leader_desc_antaixiya:0 "The youngest princess, gentle of smile and sparing of words. The expedition's envoys and spies all report directly to her, and no one knows how many secrets she truly holds."

 # Traits
 leader_trait_atb_hyperdimensional:0 "Hyperdimensional Augmentation"
 leader_trait_atb_hyperdimensional_desc:0 "This princess has undergone the hyperdimensional augmentation reserved for the imperial family. Her existence has partly slipped free of three-dimensional space-time."
 leader_trait_atb_hyperdimensional_tt:0 "- §GImmortal§!\n- §GImmune to all negative traits§!\n- §GImmune to every kind of death or removal event§! (if she is ever removed, she re-forms unchanged the next day)\n- §GNo upkeep§!\n- §GCannot be dismissed§!\n- Portrait does not change with species ascension"
 leader_trait_atb_transcendent_life:0 "Transcendent Life"
 leader_trait_atb_transcendent_life_desc:0 "Filiruoya's form of life has transcended the mortal. Under her will, the Empire can bear a size far beyond reason."
 leader_trait_atb_elemental_sovereign:0 "Elemental Sovereign"
 leader_trait_atb_elemental_sovereign_desc:0 "Yugudora drives her fleets' engines and guns with elemental power; the fleets the expedition can sustain are all but limitless."
 leader_trait_atb_grand_ascendant:0 "Grand Ascendant"
 leader_trait_atb_grand_ascendant_desc:0 "Youfeilina has glimpsed the far shore of ascension. Her learning opens more paths for the Empire's research and its leaders' growth."
 leader_trait_atb_silent_apostle:0 "Silent Apostle"
 leader_trait_atb_silent_apostle_desc:0 "Antaixiya rarely speaks, but her silence is itself a web spanning the galaxy."
 atb_princess_no_dismiss_tt:0 "$TRIGGER_FAIL$The §YPrincesses§! are the pillars of the expedition and cannot be dismissed."

 # Relic
 r_atb_princess_seal:0 "Seal of the Princess Guard"
 r_atb_princess_seal_desc:0 "A seal cast from obsidian metal and blue crystal, bearing the First Princess's white-feather emblem. The Emperor gave it to his daughters before the expedition set out - with it, they can awaken the guardian war machines sleeping deep inside the fortress."
 r_atb_princess_seal_active_tt:0 "Summons §G5§! §Y$atb_princess_guard_warform$§! at the capital (no upkeep, permanent)."
 r_atb_princess_seal_cooldown_tt:0 "\n$atb_princess_seal_cooldown$: £time£ §Y10 years§!"
 r_atb_princess_seal_on_cooldown:0 "$TRIGGER_FAIL$The §Y$r_atb_princess_seal$§! is on cooldown."

 # Army
 atb_princess_guard_warform:0 "Princess Guard Cybrex Warform"
 atb_princess_guard_warform_plural:0 "Princess Guard Cybrex Warforms"
 atb_princess_guard_warform_desc:0 "A giant war machine that slept deep inside the Origin Fortress, answering only to the Seal of the Princess Guard. It requires no upkeep."
 atb_army_princess_guard:0 "Princess Guard"

 # Modifiers
 atb_princess_seal_cooldown:0 "Seal Cooldown"
 atb_princess_seal_cooldown_desc:0 "The Seal of the Princess Guard needs time to gather its power again."
 atb_expedition_banner:0 "The Princesses' Expedition"
 atb_expedition_banner_desc:0 "We are the expedition led by the four princesses, the Empire's vanguard among the stars. On the homeworld, the Emperor awaits good news from us."

 # Anomaly
 atb_disco_gray_cat:0 "A Signal in the Storm's Wake"
 mod_country_base_minor_artifacts_produces_add:0 "£minor_artifacts£ Monthly Minor Artifacts"
 atb_disco_gray_cat_desc:0 "Among the wreckage left by the Gray Tempest, our sensors pick up a faint, broken signal. It seems to be... calling to us."

 # Start screen
 START_SCREEN_ATB_PRINCESS_EXPEDITION:0 "\n\nThe four princesses of the expedition have taken their places: First Princess Filiruoya rules the Empire, Second Princess Yugudora commands the fleets, Third Princess Youfeilina leads research, and Fourth Princess Antaixiya handles diplomacy and intelligence. On the homeworld, the Emperor awaits good news from us."

 # Events
 atb.10.name:0 "The Expedition Begins"
 atb.10.desc:0 "The jump engines of the Origin Fortress have finally cooled. Outside the viewports burns a strange, gentle star - we have named this place §YOrigin's Reach§!.\n\nOur homeworld is rich and beautiful, and our nation was the first to unlock advanced technology. Yet the nations of the homeworld still quarrel, and unification is nowhere in sight. Rather than stay confined, His Majesty the Emperor decided the Empire would reach for the stars first. He remained behind to guard our home, while his four daughters set out with the fortress and the bravest of our colonists.\n\nBut the new world did not welcome us. One colonist after another fell ill, and the physicians finally confirmed it: the illness is incurable, and our people will never again bear children.\n\nIn the great hall of the fortress, First Princess Filiruoya announced her decision: the expedition will not end here. Third Princess Youfeilina will lead the digitization of our minds, so that our people may live on in synthetic bodies. Second Princess Yugudora will command the fleet, and Fourth Princess Antaixiya will deal with the other civilizations among the stars.\n\n"Father is waiting for good news," Filiruoya said. "We will not disappoint him.""
 atb.10.a:0 "For the future of the Empire."
 atb.10.a.tt:0 "§YThe four Princesses§! have taken office as Ruler and Councilors.\nGained the relic §Y$r_atb_princess_seal$§!."
 atb.30.name:0 "Hyperdimensional Echo"
 atb.30.desc.filiruoya:0 "The air in the heart of the fortress suddenly ripples. Countless motes of light gather and weave together - and a moment later, §YFirst Princess Filiruoya§! stands before us once more, as if nothing had happened.\n\nHer augmentation means her existence no longer depends entirely on her body. As long as she endures in the higher dimensions, she will return."
 atb.30.desc.yugudora:0 "On the bridge, the goldfish all turn at once toward the same spot. Motes of light gather and weave together there - and a moment later, §YSecond Princess Yugudora§! stands before us once more, as if nothing had happened.\n\nHer augmentation means her existence no longer depends entirely on her body. As long as she endures in the higher dimensions, she will return."
 atb.30.desc.youfeilina:0 "The shadowy mist in the laboratory stirs without a breeze and slowly takes on a familiar shape - §YThird Princess Youfeilina§! stands before us once more, as if nothing had happened.\n\nHer augmentation means her existence no longer depends entirely on her body. As long as she endures in the higher dimensions, she will return."
 atb.30.desc.antaixiya:0 "There is no warning and no sound. When we come to our senses, §YFourth Princess Antaixiya§! is already standing quietly among us, with a faint smile, as if nothing had happened.\n\nHer augmentation means her existence no longer depends entirely on her body. As long as she endures in the higher dimensions, she will return."
 atb.30.a:0 "Welcome back, Your Highness."

 # Origin Fortress features
 d_atb_fortress_core:0 "Fortress Energy Core"
 d_atb_fortress_core_desc:0 "The heart of the Origin Fortress: a reactor that never once went dark through the entire jump. The Empire's engineers gave it a design life longer than the Empire's own history. Today its waste heat warms the farms, its spare power drives the mines, and the lights that burn all night in the research halls all come from its steady pulse."
 d_atb_star_sea_monument:0 "Imperial Star-Sea Monument"
 d_atb_star_sea_monument_desc:0 "A monument stands in the fortress atrium. It bears no statue, only a star chart: a line of light leaves the homeworld, crosses countless systems, and stops at Origin's Reach. Beyond its end lies a long stretch of blank space - and everyone who passes silently draws it one step further."
 d_atb_sensor_array:0 "Origin Fortress Star-Sea Sensor Array"
 d_atb_sensor_array_desc:0 "A vast sensor array unfolded along the fortress hull, first built to guide the fortress through its jump. At Origin's Reach it looks much further - so far that even the Fourth Princess admits her spies do not see as clearly."
 d_atb_elemental_seal_institute:0 "High Elemental Sealing Institute"
 d_atb_elemental_seal_institute_desc:0 "Deep inside the fortress, behind seals that only the princesses can open, the Empire's scholars keep the elemental arts they carried from the homeworld. Its vaults hold more than any storehouse in the expedition, and every year they turn up another relic of the old world."

 # Dreadnought
 atb_dreadnought:0 "Dreadnought"
 atb_dreadnought_plural:0 "Dreadnoughts"
 atb_dreadnought_cap:0 "$atb_dreadnought$"
 tech_atb_dreadnought:0 "Dreadnoughts"
 tech_atb_dreadnought_desc:0 "Fit a titan's main gun into a battleship hull. A tighter keel and a titan-class reactor let a single battleship carry a titanic weapon capable of tearing open an entire fleet formation."
 TECH_UNLOCK_ATB_DREADNOUGHT_CONSTRUCTION_TITLE:0 "§H$UNLOCKS_SHIP_TYPE$: §!Dreadnought"
 TECH_UNLOCK_ATB_DREADNOUGHT_CONSTRUCTION_DESC:0 "§HDreadnought§!\nA battleship-class hull whose bow can mount one §YTitanic (T)§! weapon, powered by a titan reactor."
 ATB_DREADNOUGHT_BOW_L1M1S2:0 "$BATTLESHIP_BOW_L1M1S2$"
 ATB_DREADNOUGHT_BOW_L2:0 "$BATTLESHIP_BOW_L2$"
