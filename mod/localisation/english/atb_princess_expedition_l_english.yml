 # Expedition authority
 auth_atb_expedition:0 "Expeditionary Order"
 auth_atb_expedition_desc:0 "Once the last of our people had been digitized, the expedition was no longer a vanguard waiting to be called home. The princesses rebuilt the Empire's order in synthetic form: power still rests with the First Princess, but every synthetic citizen is promised the same abundant life - the promise the princesses made before their father on the day the expedition set out."
 auth_atb_expedition_tt:0 "§Y$living_standard_utopian$§! living standard: does not require Egalitarian ethics\nCan unlock §YAdvanced Robotic Traits§!"
 atb_regime_requires_dictatorial:0 "$TRIGGER_FAIL$Requires §Y$auth_dictatorial$§! authority."

 atb.40.name:0 "A New Order for the Expedition"
 atb.40.desc:0 "Some days have passed since the Synthetic Dawn. No one coughs in the fortress corridors anymore. The medical bays have become storerooms, and the nurseries have been repainted to await the first newly made synthetic citizens.\n\nToday the four princesses have called the whole council to the great hall. §YFirst Princess Filiruoya§! lays a thin document on the table.\n\n“When we set out, we were an expedition waiting to go home. But we can never go back - not because the road is too long, but because we have become a different people.” She pauses. “So let this place become what the Empire truly is.”\n\nThe document lays out a new order: power remains concentrated, but every citizen - whoever they once were - will share the same abundant life. §YThird Princess Youfeilina§! adds that every technique for reshaping machine bodies will be opened as well.\n\nThe hall is silent. At last, §YFourth Princess Antaixiya§! gives a small nod."
 atb.40.a:0 "Establish the Expeditionary Order."
 atb.40.a.tt:0 "Authority becomes the §Y$auth_atb_expedition$§!:\n- Same effects as the §Y$auth_synth_dictatorial_physical$§!, including unlocking §YAdvanced Robotic Traits§!\n- Can use the §Y$living_standard_utopian$§! living standard\n- Empire Size from pops and districts: §G-12%§!"
 atb.40.b:0 "Not yet."
 atb.40.b.tt:0 "It can be established later through the capital decision §Y$decision_atb_adopt_expedition_regime$§!."

 # Luminary: First Princess Filiruoya
 atb.51.name:0 "A Letter from Father"
 atb.51.desc:0 "The thirty-year plan has run its course. Today a faster-than-light letter from the homeworld reached the Origin Fortress - the first the Emperor has sent since the expedition set out.\n\nIt is short. The Emperor does not ask how many systems the expedition has taken, or what the factories produce. He only asks whether his four daughters are well, whether the winters in the fortress are cold, and ends: “Everyone on the homeworld is talking about you. Filiruoya, you are no longer only my daughter.”\n\n§YFirst Princess Filiruoya§! read the letter twice, then, before the whole council, placed it in the seal case. She did not repeat a single word of it.\n\nA councilor suggested that the time had come to crown the First Princess. She shook her head. “There is only one Emperor among these stars, and he is on the homeworld. We are his expedition.”"
 atb.51.a:0 "The expedition has only just begun."
 atb.51.b:0 "This glory belongs to Father."
 atb.51.b.tt:0 "§YFirst Princess Filiruoya§!'s standing as ruler increases."

 atb.52.name:0 "The Star-Sea Oath"
 atb.52.desc:0 "At the celebration of the expedition's founding day, §YFirst Princess Filiruoya§! stepped onto the fortress observation deck to speak to the whole Empire.\n\nShe had no script. She spoke of that first cold winter, of the colonists falling ill one after another, of the nights Youfeilina spent in her laboratory; of the first triumphant return of Yugudora's fleet, and of the report Antaixiya brought back that changed everything.\n\n“People ask me when we are going home,” she said. “My answer is this: every world beneath our feet is home.”\n\nThat day her image filled every screen in the Empire. Years later, people were still repeating her words in the streets."
 atb.52.a:0 "The stars are our home."
 atb.52.b:0 "Let the oath spread across the Empire."
 atb.52.b.tt:0 "Gain the §Y$atb_star_sea_oath$§! modifier for §Y10 years§!."

 atb.53.name:0 "The Unfading Star"
 atb.53.desc:0 "As the old saying goes, every Luminary's story must end: even the greatest leader grows old, even the firmest grip loosens, and one day the people must learn to live in a world without them.\n\nBut Filiruoya has not grown old.\n\nHer hyperdimensional augmentation stopped her time on the day she left the homeworld. The colonists who followed her have long since taken synthetic bodies, and the citizens made after them have seen the same face at every celebration for as long as they can remember. To them the First Princess is not one ruler among many, but something like the star of Origin's Reach - simply, always there.\n\nTonight Filiruoya stands alone before the Star-Sea Monument, looking at the long blank stretch at the end of the chart. She stands there a long time. At last she reaches out, and draws the line of light one step further."
 atb.53.a:0 "She will always be there."
 atb.53.a.tt:0 "§YFirst Princess Filiruoya§!'s standing as ruler greatly increases.\nGain the permanent modifier §Y$atb_unfading_star$§!."

 atb_star_sea_oath:0 "The Star-Sea Oath"
 atb_star_sea_oath_desc:0 "“Every world beneath our feet is home.” The First Princess's words are still repeated in the streets of the Empire."
 atb_unfading_star:0 "The Unfading Star"
 atb_unfading_star_desc:0 "First Princess Filiruoya will neither age nor leave. To the people of the expedition, she is as constant as the star of Origin's Reach."

 # Capital decisions
 decision_atb_precursor_secrets:0 "Explore the Secrets of the Precursors"
 decision_atb_precursor_secrets_desc:0 "The researchers of the archaeology lab have pieced together a list: seven long-vanished precursor civilizations, seven buried legacies. Given enough artifacts to follow the trail, we can recover them one by one."
 decision_atb_precursor_secrets_tt:0 "Gain a random §YPrecursor technology§! not yet known ($tech_secrets_cybrex$, $tech_secrets_league$, $tech_secrets_irassian$, $tech_secrets_vultaum$, $tech_secrets_yuht$, $tech_secrets_baol$, $tech_secrets_zroni$), until all seven are known."
 decision_atb_adopt_expedition_regime:0 "Establish the Expeditionary Order"
 decision_atb_adopt_expedition_regime_desc:0 "Since the Synthetic Dawn, the new order the princesses drafted for the Empire has lain on the council table, waiting to be signed."
 # 3.6: The psionic path
 atb.50.name:0 "The Goldfish Swim Toward the Veil"
 atb.50.desc:0 "Since the Synthetic Dawn, the citizens of the Expedition have grown used to bodies that do not age. Yet for months now, the goldfish around §YSecond Princess Yugudora§! on the bridge have all been swimming the same way - toward nothing at all, a blank at the edge of the star chart that no sensor will record.\n\n“They are listening,” Yugudora says. “The elemental spirits were never of this universe. Something on the other side of the veil is calling, and they understand it.”\n\nShe lays a hand on her cold metal chest. “They say machines have no soul, and so can never reach the Shroud. But we are not ordinary machines - we are people who walked through death and kept our memories. If my sisters allow it, I would take the Expedition to see what lies beyond the veil.”"
 atb.50.a:0 "Go, Yugudora. Open that door for us."
 atb.50.a.tt:0 "Even after Synthetic Ascension, the §YCangshen Empire§! may now take the §H$ap_mind_over_matter$§! Ascension Perk (Psionic Ascension), and adopt the §H$tradition_psionics$§! tradition and its agendas.\nThe Shroud will make our machine bodies §H$trait_latent_psionic$§!, and §H$trait_psionic$§! once awakened."
