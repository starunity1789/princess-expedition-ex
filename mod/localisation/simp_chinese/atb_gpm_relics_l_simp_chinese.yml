l_simp_chinese:
 # 由 tools/gen_gpm_relics.py 从 GPM 抽取生成，请勿手改
 NAME_venerable_dreadnaught:0 "The Venerable Dreadnaught"
 NAME_venerable_dreadnaught_fleet:0 "The Venerable Dreadnaught"
 NAME_venerable_dreadnaught_ship:0 "The Venerable Dreadnaught"
 NAME_xenomorph:0 "Xenomorphs"
 NAME_xenomorph_fleet:0 "Ravenous Xenomorphs"
 NAME_xenomorph_ship:0 "Xenomorph Carrier"
 atb_gpm_floating_islands_housing:0 "浮岛住房"
 atb_gpm_floating_islands_housing_desc:0 "重力引擎托起的巨大浮岛，为这颗星球提供了大量新的建设空间与住房。"
 atb_gpm_planetary_shield_array:0 "先驱护盾阵列"
 atb_gpm_planetary_shield_array_desc:0 "分布在这颗星球上的护盾阵列撑起了一层几乎无法击穿的屏障。"
 decision_gpm_Floating_Island_Housing:0 "建造浮岛"
 decision_gpm_Floating_Island_Housing_desc:0 "在这个星球上建造巨大的人工浮岛。"
 decision_gpm_Floating_Island_Housing_effects:0 "行星最大区划数: §G+1§!\n行星住房数: §G+10§!"
 decision_gpm_Unstable_Tectonics:0 "稳定断层"
 decision_gpm_Unstable_Tectonics_desc:0 "钻入该星球断层线深处的人工通风孔可以定期喷出熔融岩石和气体，以此释放压力。"
 decision_gpm_acidic_seas:0 "海洋去酸化"
 decision_gpm_acidic_seas_desc:0 "我们的殖民地将尝试减少这一星球海洋的酸性。"
 decision_gpm_bleak_fertilize_world:0 "Localised Terraforming"
 decision_gpm_bleak_fertilize_world_desc:0 "Attempt to improve the soil quality of this world."
 decision_gpm_blighted_lands:0 "Revitalise the land"
 decision_gpm_blighted_lands_desc:0 "Scorch the blighted lands and reintroduce a variery of fauna and flora."
 decision_gpm_carnivorous_flies:0 "设置捕蝇器"
 decision_gpm_carnivorous_flies_desc:0 "我们的殖民地将尝试解决食肉蝇「问题」。"
 decision_gpm_clear_alien_eggs:0 "Squash the Eggs"
 decision_gpm_clear_alien_eggs_desc:0 "Destroy the alien eggs. This may have consequences. "
 decision_gpm_clear_arachnophobia:0 "Orbital Napalm Campaign"
 decision_gpm_clear_arachnophobia_desc:0 "Drop napalm from orbit. This is fine."
 decision_gpm_clear_hazardous_weather:0 "Global Weather Control"
 decision_gpm_clear_hazardous_weather_desc:0 "Attempt a daring project to tame the harsh weather on this world."
 decision_gpm_clear_melted_icecaps:0 "Construct Thermal Exchangers"
 decision_gpm_clear_melted_icecaps_desc:0 "Dot the polar region with thermal exchangers allowing ice to form once again."
 decision_gpm_clear_ocean_dragons:0 "Hunt for the Dragon"
 decision_gpm_clear_ocean_dragons_desc:0 "Launch a military campaign using specially modified swarmer missiles capable of reaching the vast depths where the ocean dragons roam."
 decision_gpm_clear_sandstorms:0 "Sticky Sand"
 decision_gpm_clear_sandstorms_desc:0 "Cover the vast sand dunes of this world with a sticky substance greatly reducing the amount of sand being swept away by wind."
 decision_gpm_clear_temp_variation:0 "Build Weather Control Stations"
 decision_gpm_clear_temp_variation_desc:0 "Millions of weather control stations will be build across the surface of this world in order to master it's weather. "
 decision_gpm_clear_titanic_predators:0 "Hunt the hunters."
 decision_gpm_clear_titanic_predators_desc:0 "Hunt the deadly predators on this world to extinction."
 decision_gpm_clear_toxic_gas:0 "Neutralize Toxic Gasses"
 decision_gpm_clear_toxic_gas_desc:0 "A planet wide effort is made to neutralise the lingering toxic gas clouds vastly improving the living conditions on this world."
 decision_gpm_clear_weak_magnetic_field:0 "Charge the planet core"
 decision_gpm_clear_weak_magnetic_field_desc:0 "Using the planetary shield we can transfer a massive surge of energy into the planet core. The subsequent heating of the core will boost the magnetic field."
 decision_gpm_clear_wild_storms:0 "Temper the Storms"
 decision_gpm_clear_wild_storms_desc:0 "A little atmospheric manipulation goes a long way"
 decision_gpm_dark_skies:0 "Stratospheric Seeding"
 decision_gpm_dark_skiesTT:0 "§YRandom chance§!: Add a §LNeutral§! or §GPositive§! Planet Modifier"
 decision_gpm_dark_skies_desc:0 "Seed the stratosphere with microscopic dust particles causing the thick clouds to condense and rain down."
 decision_gpm_evolve_simple_organisms:0 "Rapid Evolution"
 decision_gpm_evolve_simple_organisms_desc:0 "Attempt to Rapidly Evolve the many simple organisms on this world."
 decision_gpm_fix_ozone_layer:0 "Restore Ozone Layer"
 decision_gpm_fix_ozone_layer_desc:0 "Restore the damaged ozone layer on this world."
 decision_gpm_habitat_archaeology_section:0 "Build An Archeology Hub"
 decision_gpm_habitat_archaeology_section_desc:0 "Convert a sector of this habitat to an archeology hub."
 decision_gpm_habitat_asteroid_catchers:0 "Build Asteroid Catchers"
 decision_gpm_habitat_asteroid_catchers_desc:0 "Build large asteroid catching dronebays on this habitat allowing it to slow down nearby asteroids and direct it to one of the mineral proccesing bays."
 decision_gpm_habitat_belt_mining:0 "Build Asteroid Mining Infrastructure"
 decision_gpm_habitat_belt_mining_desc:0 "Build asteroid holding nets and raw mineral refineries on this habitat."
 decision_gpm_habitat_chlorine_extraction:0 "Build Chlorine Extractors"
 decision_gpm_habitat_chlorine_extraction_desc:0 "Build advanced Chlorine seperating infrastructure."
 decision_gpm_habitat_chronoton_sensors:0 "Build Chronoton Sensors"
 decision_gpm_habitat_chronoton_sensors_desc:0 "Build an array of hyper-sensative sensors that can detect even the smallest variations in space-time across this system."
 decision_gpm_habitat_egg_containment_facility:0 "Build Xeno Egg Containment"
 decision_gpm_habitat_egg_containment_facility_desc:0 "Build a xeno egg containment facility to prevent what happened last time."
 decision_gpm_habitat_expedition_section:0 "Build Expedition Docks"
 decision_gpm_habitat_expedition_section_desc:0 "Build docks specifically designed to accomadate all the equipment needed to perform alien expeditions, including new and improved quarantine cells. "
 decision_gpm_habitat_food_recyclers:0 "Install Waste Recyclers"
 decision_gpm_habitat_food_recyclers_desc:0 "Install hyper-efficient waste recycling facilities, turning poop into edible goop!"
 decision_gpm_habitat_gambling_licence:0 "Build Gambling Office"
 decision_gpm_habitat_gambling_licence_desc:0 "Build a gambling office, if there's going to be gambling, we may as well tax it!"
 decision_gpm_habitat_holo_entertainment:0 "Install Holo-Entertainment"
 decision_gpm_habitat_holo_entertainment_desc:0 "Install holo decks on every floor and in every sector of this habitat. "
 decision_gpm_habitat_hub:0 "Designate Trade Hub"
 decision_gpm_habitat_hub_desc:0 ""_desc:0 "Designate this habitat as the systems primary trade hub allowing it to coordinate trade much more efficiently."
 decision_gpm_habitat_hydrogen_extraction:0 "Build Hydrogen Extractors"
 decision_gpm_habitat_hydrogen_extraction_desc:0 "Build advanced hydrogen seperating infrastructure."
 decision_gpm_habitat_iron_extraction:0 "Build Pure Iron Extractors"
 decision_gpm_habitat_iron_extraction_desc:0 "Build high-heat furnaces to extrace the pure iron found on the planet below."
 decision_gpm_habitat_mining_bays:0 "Build Mining Bays"
 decision_gpm_habitat_mining_bays_desc:0 "Expand the habitat with cheap mining bays allowing ships to easily dump mined rocks for processing"
 decision_gpm_habitat_moon_mining:0 "Build Moon Mining Infrastructure"
 decision_gpm_habitat_moon_mining_desc:0 "Build cargo docks and raw mineral refineries on this habitat."
 decision_gpm_habitat_nitrogen_extraction:0 "Build Nitrogen Extractors"
 decision_gpm_habitat_nitrogen_extraction_desc:0 "Build advanced Nitrogen seperating infrastructure."
 decision_gpm_habitat_particle_collectors:0 "Build Partical Collectors"
 decision_gpm_habitat_particle_collectors_desc:0 "Build long particle collecting arrays at the bottom of this habitat reaching all the way down into the upper atmosphere of the planet below. "
 decision_gpm_habitat_phospherus_extraction:0 "Build Phosperus Extractors"
 decision_gpm_habitat_phospherus_extraction_desc:0 "Build advanced Phosperus seperating infrastructure."
 decision_gpm_habitat_pleasure_palace:0 "Build Pleasure District"
 decision_gpm_habitat_pleasure_palace_desc:0 "Build a hot steamy pleasure district."
 decision_gpm_habitat_radioactive_mining:0 "Build Alloy Mining Infrastructure"
 decision_gpm_habitat_radioactive_mining_desc:0 "Build cargo docks and advanced alloy refineries on this habitat."
 decision_gpm_habitat_replicators:0 "Install Replicator Systems"
 decision_gpm_habitat_replicators_desc:0 "Install material and food recplicators in every hallway, bar and restaurant. "
 decision_gpm_habitat_spice_markets:0 "Approve Spice Markets"
 decision_gpm_habitat_spice_markets_desc:0 "Approve the trade of highly adictive spice."
 decision_gpm_habitat_stadium:0 "Build A Stadium"
 decision_gpm_habitat_stadium_desc:0 "Build a grand stadium at the heart of the habitat."
 decision_gpm_habitat_sulfur_extraction:0 "Build Sulfur Extractors"
 decision_gpm_habitat_sulfur_extraction_desc:0 "Build advanced Sulfur seperating infrastructure."
 decision_gpm_habitat_thunderstorm_research:0 "Build Research Infrastructure"
 decision_gpm_habitat_thunderstorm_research_desc:0 "Build advanced research facilities within this habitat."
 decision_gpm_habitat_trade_docks:0 "Expand Trade Docks"
 decision_gpm_habitat_trade_docks_desc:0 "Expand the trade docks on this habitat allowing more trade ships to dock."
 decision_gpm_hostile_flora:0 "物种入侵"
 decision_gpm_hostile_flora_desc:0 "通过种植一些极具侵略性的植物，我们可以使原生植物窒息，以此获得更友好的生物群落。"
 decision_gpm_hunt_roaming_killbots:0 "狩猎杀戮机器"
 decision_gpm_hunt_roaming_killbots_desc:0 "呼吁协助消灭游荡在大地上的杀戮机器人。"
 decision_gpm_lingering_pollution:0 "清理污染"
 decision_gpm_lingering_pollution_desc:0 "我们的殖民地将尝试清除这个星球中空气里残留的污染物。"
 decision_gpm_listen_to_the_voices:0 "Give in to the voices"
 decision_gpm_listen_to_the_voicesTT:0 "Chance to lose a pop or gain a boon"
 decision_gpm_listen_to_the_voices_desc:0 "The population of this world is directed to listen to the voices and give in."
 decision_gpm_locust_plagues:0 "扫除一切害人虫"
 decision_gpm_locust_plagues_desc:0 "我们的殖民地将尝试阻止蝗灾危害殖民地发展。"
 decision_gpm_machine_world_core_relic:0 "同化世界"
 decision_gpm_machine_world_core_relic_desc:0 "用§Y充能的机械世界核心§!遗珍将这个世界变成机器世界。\n"
 decision_gpm_machine_world_core_relic_tt:0 "§G加载boot.ini。\n待命中。§!"
 decision_gpm_placade_arachnophobia:0 "Artificial Feeding Campaign"
 decision_gpm_placade_arachnophobia_desc:0 "Feed the native arachnid inhabitants with pheromone-based food in order to placate them."
 decision_gpm_resilent_parasites:0 "寄生虫战争"
 decision_gpm_resilent_parasites_desc:0 "我们的殖民地将尝试找到一种能治愈感染顽强寄生虫居民的方法。"
 decision_gpm_restore_oppertunity:0 "Restore Our Lost Friend"
 decision_gpm_restore_oppertunity_desc:0 "Hey there buddy, time for a new battery and a scrub. We're finally reunited.."
 decision_gpm_ringworld_badlands:0 "Lawless Sectors"
 decision_gpm_ringworld_badlands_desc:0 "Designate this ring world section as a lawless sector. Let the people decide for themselves how to govern it."
 decision_gpm_ringworld_endless_oceans:0 "Vast oceans"
 decision_gpm_ringworld_endless_oceans_desc:0 "Terraform large areas on this ring section so it can support vast and endless oceans."
 decision_gpm_ringworld_idyllic_gardens:0 "Idyllic Garden Sectors"
 decision_gpm_ringworld_idyllic_gardens_desc:0 "Build several sectors on this ring world section with unbelievable beautiful gardens."
 decision_gpm_ringworld_mass_transit:0 "Mass Transit System"
 decision_gpm_ringworld_mass_transit_desc:0 "Install a section wide mass transit system greatly assisting in providing the needs of the populace."
 decision_gpm_ringworld_neural_nexus:0 "Embeded Neural Nexus"
 decision_gpm_ringworld_neural_nexus_desc:0 "A vast network of machine learning modules is installed across the entire ring section allowing this part of the ringworld to solve problems and make itself more efficient on its own."
 decision_gpm_ringworld_parabolic_forcefield:0 "Psionic Forcefields"
 decision_gpm_ringworld_parabolic_forcefield_desc:0 "A single powerful psionic forcefield is used to contain the atmosphere of the ring section. While simultanious strong and less power hungry, this forcefield also magnifies the view outside of the ring section allowing for some truly breathtaking views."
 decision_gpm_ringworld_simulators:0 "Simulator Sectors"
 decision_gpm_ringworld_simulators_desc:0 "Install large training sectors on this ring section allowing for our populace to be ready when the enevitable happens."
 decision_gpm_ringworld_xeno_zoo:0 "Xeno Wildlife Preserves"
 decision_gpm_ringworld_xeno_zoo_desc:0 "Vast areas of this ring section will be dedicated as xeno wildlife preserves."
 decision_gpm_seasonal_flooding:0 "建立防洪工程"
 decision_gpm_seasonal_flooding_desc:0 "我们的殖民地将尝试遏制这个星球上频繁发生的季节性洪水。这将需要几个月的时间。"
 decision_gpm_shield_generator_arrays:0 "建造护盾阵列"
 decision_gpm_shield_generator_arrays_desc:0 "在这个星球上分布建造几个护盾阵列，这将产生一个能够击退最强能量武器的覆盖整个星球范围的护盾。"
 decision_gpm_shield_generator_arrays_tt:0 "将这个星球§Y封装§!在一个近乎坚不可摧的护盾中。"
 decision_gpm_unusual_seasons:0 "云朵播种"
 decision_gpm_unusual_seasons_desc:0 "在关键位置仔细覆盖人造云层可以稳定地球的大气气流。"
 decision_gpm_upgrade_machine_world:0 "Enhance Machine World"
 decision_gpm_upgrade_machine_world_TT:0 "§HEnhances§! one aspect of this machine world with £minor_artifacts£ §HMinor Artifacts§! granting either aditional £physics_research£ £society_research£ £engineering_research£, £energy£, £minerals£, £alloys£ or £rare_crystals£ £exotic_gases£ £volatile_motes£ production."
 decision_gpm_upgrade_machine_world_desc:0 "Technology can always be improved with more technology!"
 gpm_d_floating_islands_housing:0 "人造浮岛"
 gpm_d_planetary_shield_array:0 "先进护盾阵列"
 gpm_machine_world_core_ark_bonus:0 "Machine Core Boost"
 gpm_machine_world_core_ark_bonusTT:0 "\n§HEvery Ark Ship:§!\n  §Y$gpm_machine_world_core_ark_bonus$§! modifier added for §Y5§! Years:\n    Stability: §G+5§!\n    Resources from £job£ Jobs: §G+15%§!\n    Infrastructure Build Speed: §G+50%§!\n    Build Queue Capacity: §G+1§!"
 gpm_machine_world_core_ark_bonus_desc:0 "The machine worldcore has temporarily boosted the efficiency of this arkship. Systems aboard the arkship can only take so much before they overload."
 gpm_precursor_planetary_shield_on:0 "启动的先驱者护盾阵列"
 gpm_precursor_planetary_shield_on_nomads:0 "Integrated Precursor Shield Arrays"
 gpm_r_ai_architect:0 "AI建筑师"
 gpm_r_ai_architect_active_effect:0 "$gpm_r_ai_architect$"
 gpm_r_ai_architect_desc:0 "一个喜怒无常的人工智能，一直坚持构建它的三角形设计。要让它同意设计一些正常的东西，需要付出很大的努力。"
 gpm_r_alien_eggs:0 "异星女王"
 gpm_r_alien_eggs_active_effect:0 "在你的首都附近生成几个§Y异星变体军队§!\n"
 gpm_r_alien_eggs_desc:0 "不 要 释 放 她"
 gpm_r_alien_eggs_fleetTT:0 "Gain a small xenomorph army fleet"
 gpm_r_alien_eggs_recoveryTT:0 "Barely surviving an ambush, our science team has managed to recovery a large live specimen believed to be the broodmother of the strange eggs.\n"
 gpm_r_banner_of_the_fallen:0 "堕落者的旗帜"
 gpm_r_banner_of_the_fallen_active_effect:0 "$gpm_r_banner_of_the_fallen$"
 gpm_r_banner_of_the_fallen_desc:0 "这面神秘的旗帜似乎对任何站在附近的人都有积极的鼓励作用。读数表明，这种织物会产生某种灵能场。"
 gpm_r_cloaking_device:0 "隐形装置"
 gpm_r_cloaking_device_active_effect:0 "$gpm_r_cloaking_device$"
 gpm_r_cloaking_device_desc:0 "这种隐身装置能够通过弯曲周围的时空来隐藏大型物体。"
 gpm_r_cloaking_device_passive_effect_tooltip:0 "允许舰队统帅随机获得§H隐形战术家§!特性."
 gpm_r_codex_administratum:0 "行政法典"
 gpm_r_codex_administratum_active_effect:0 "$gpm_r_codex_administratum$"
 gpm_r_codex_administratum_desc:0 "这本古老的物理形式存在的典籍，保存着空间扩张的所有规定。它的皮革封面和通透的薄页是由一种不知名的生物材料制作而成，上面印有微观文字。"
 gpm_r_datacube:0 "数据方块"
 gpm_r_datacube_active_effect_tooltip:0 "获得三个随机科技"
 gpm_r_datacube_desc:0 "这个奇怪的数据方块散发着幽幽的光芒。当被触摸时，它就会裂开，并露出一个更奇怪的东西。当被提问时，数据方块有时会透露一些它的秘密。"
 gpm_r_earthquake_engine:0 "地震引擎"
 gpm_r_earthquake_engine_desc:0 "一个奇怪的浮动装置，能在其下方制造出锥体状的局部定向地震。据推测，这是用来软化地壳的，以便于采矿作业。"
 gpm_r_encrypted_sct:0 "加密的SCT"
 gpm_r_encrypted_sct_active_effect:0 "$gpm_r_encrypted_sct$"
 gpm_r_encrypted_sct_desc:0 "128b42 - viO9oo96eSf0AlyFelwIkGgMrs8LYTtecfV6aN33qjQ="
 gpm_r_encyclopedia_galactica:0 "银河百科全书"
 gpm_r_encyclopedia_galactica_active_effect_tooltip:0 "临时增加所有堕落帝国的评价。"
 gpm_r_encyclopedia_galactica_desc:0 "《银河百科全书》中大部分被破坏的数据库，曾经保存着一个古老文明的集体知识。"
 gpm_r_enigmatic_advisor:0 "神秘顾问"
 gpm_r_enigmatic_advisor_active_effect:0 "$gpm_r_enigmatic_advisor$"
 gpm_r_enigmatic_advisor_desc:0 "这位健谈的人工智能顾问对古代帝国及其崛起和随后的衰落的历史有着丰富的知识，在外交事务上可以作为我们宝贵的资产。"
 gpm_r_experimental_weapon:0 "实验性武器"
 gpm_r_experimental_weapon_active_effect:0 "$gpm_r_experimental_weapon$"
 gpm_r_experimental_weapon_desc:0 "在一个古老帝国的末期设计的实验性武器。它没能阻止这个帝国的灭亡... ..."
 gpm_r_fallout_emergency_replicator:0 "辐射应急复制器"
 gpm_r_fallout_emergency_replicator_desc:0 "一个自维持的装置，能够由泥土本身提供动力。它能制造出你生存所需的一切。"
 gpm_r_gravity_engine:0 "重力操纵器"
 gpm_r_gravity_engine_active_effect_tooltip:0 "允许你使用行星决议§H$decision_gpm_Floating_Island_Housing$§!，在一个单一的殖民星球上建立巨大的浮空城市。"
 gpm_r_gravity_engine_desc:0 "该装置能够在一个非常局部的区域内操纵重力场，它可以扩大或缩小重力场。这使得该装置能够在中心点周围增加或减少重力。"
 gpm_r_machine_world_core:0 "机械世界核心"
 gpm_r_machine_world_core_active_tooltip:0 "对§H机械世界核心§!进行超充能后吗，它便能将一个§Y非宜居星球§!、§Y气态巨行星§!或§Y残破星球§!同化为§H机械星球§!\n\n为我们境内的非宜居星球解锁§Y同化星球§!行星决议。\n\n§R这将移除这一遗珍§!\n"
 gpm_r_machine_world_core_desc:0 "一个休眠的机械世界核心，等待被重新充电…"
 gpm_r_manufactorium_ship:0 "制造厂舰船残骸"
 gpm_r_manufactorium_ship_desc:0 "这艘近乎完整的残骸是一艘古老的制造船。它的船上工厂可以生产各种材料。"
 gpm_r_mars_rover:0 "被修复的机遇号"
 gpm_r_mars_rover_active_tooltip:0 "为Opportunity的电池充电，消耗£energy£10（此举无意义）。"
 gpm_r_mars_rover_desc:0 "机遇号已经完全恢复，正在快乐地绕着火星行驶。"
 gpm_r_mysterious_shield_generator:0 "古代科技护盾发生器"
 gpm_r_mysterious_shield_generatorTT_normal:0 "§YCivilian Space Station§! £ship_stats_shield£ $MOD_SHIP_SHIELD_ADD$: §G+1000§!\n§YMilitary Station§! £ship_stats_shield£ $MOD_SHIP_SHIELD_ADD$: §G+1500§!\n§YStarbase§! £ship_stats_shield£ $MOD_SHIP_SHIELD_ADD$: §G+2000§!\n§YDeep Space Citadel§! £ship_stats_shield£ $MOD_SHIP_SHIELD_ADD$: §G+5000§!\n§YOrbital Ring§! £ship_stats_shield£ $MOD_SHIP_SHIELD_ADD$: §G+10000§!"
 gpm_r_mysterious_shield_generator_active_effect_tooltip:0 "允许你使用行星决议§H$decision_gpm_shield_generator_arrays$§!,在一个单一的殖民星球上建立一系列的护盾阵列，并将一个强大的行星护盾覆盖在这个星球上。"
 gpm_r_mysterious_shield_generator_active_effect_tooltip_nomads:0 "Allows you to build a series of shield arrays on a single habited world or Ark ship covering it in a powerful planetary shield using the §YPlanetary Decision§!:\n\n§YDecision:§! §H$decision_gpm_shield_generator_arrays$§!\n  Add deposit: §Y$gpm_d_planetary_shield_array$§!\n    £physics_research£ Physics Research: §G+10§!\n\n  Add Planet Modifier: §Y$gpm_precursor_planetary_shield_on_nomads$§!\n    Ark Ship Shield HP: §G+20000§!\n    Pop Happiness: §G+5%§!\n    $MOD_PLANET_RESETTLEMENT_UNEMPLOYED_DESTINATION_MULT$: §G+40%§!"
 gpm_r_mysterious_shield_generator_desc:0 "这种相对较小的护盾发生器能够产生一个小型的能量场来阻挡能量攻击。它可以构成一个大型护盾发生器网络的基础，这有可能覆盖整个星球！"
 gpm_r_positronic_microchip:0 "正电子芯片"
 gpm_r_positronic_microchip_desc:0 "正电子线框模压成型的微芯片。这种正电子微芯片可以实现以前闻所未闻的功率计算效率。"
 gpm_r_positronic_nervious_system_active_effect:0 "$gpm_r_positronic_microchip$"
 gpm_r_power_core:0 "动力核心"
 gpm_r_power_core_active_effect:0 "$gpm_r_power_core$"
 gpm_r_power_core_desc:0 "从一个古老的反应堆中提取出来的，这个动力核心至少可以再生产千年的电力。"
 gpm_r_q_storage_compressor:0 "量子存储压缩机"
 gpm_r_q_storage_compressor_desc:0 "量子存储理论上能够存储无限量的物质。它需要巨大的能量来存取它的内容，而且由于量子力学的性质，我们只能知道里面有什么，或者知道它的位置，但永远不会两者兼而有之！我们只有在它离开量子存储装置后，才会知道我们取出来的东西。"
 gpm_r_quantum_sphere:0 "量子球"
 gpm_r_quantum_sphere_active_effect:0 "$gpm_r_quantum_sphere$"
 gpm_r_quantum_sphere_desc:0 "一个难以想象的精密球体，能够观察到其他太阳系。似乎整个球体与银河系本身是量子纠缠在一起的。"
 gpm_r_self_assembly_hub:0 "自组装枢纽"
 gpm_r_self_assembly_hub_active_effect:0 "$gpm_r_self_assembly_hub$"
 gpm_r_self_assembly_hub_desc:0 "这个自主的中枢能够复制自己的部分建筑卷须，使其能够自行建造几乎任何规模的东西。"
 gpm_r_self_repairing_obelisk:0 "自修复方尖碑"
 gpm_r_self_repairing_obelisk_active_effect:0 "$gpm_r_self_repairing_obelisk$"
 gpm_r_self_repairing_obelisk_desc:0 "一个能够自我修复任何损伤的全功能装置。这个装置似乎覆盖着一层由纳米机器组成的薄膜。"
 gpm_r_sentinel_queen:0 "哨兵女王"
 gpm_r_sentinel_queen_active_effect:0 "$gpm_r_sentinel_queen$"
 gpm_r_sentinel_queen_desc:0 "这种自主的人工智能能够控制数十亿架哨兵无人机，来维持任何世界的秩序和安全。"
 gpm_r_soul_gem:0 "古魂棱镜"
 gpm_r_soul_gem_active_effect:0 "获得一个等级5的领袖，他与一个古老的灵魂共享身体。"
 gpm_r_soul_gem_active_effect_machine:0 "Gain a random physics technology"
 gpm_r_soul_gem_desc:0 "这块奇怪的宝石似乎拥有强大的灵魂。当你凑近仔细听的时候，你有时会听到他们的尖叫……"
 gpm_r_time_displacer:0 "时间位移器"
 gpm_r_time_displacer_desc:0 "这个装置似乎对它附近的其他物体有一定的时间相对性影响。"
 gpm_r_venerable_dreadnaught:0 "神圣无畏舰"
 gpm_r_venerable_dreadnaught_active_effect_tooltip:0 "生成一个§H神圣无畏舰军队§!。这个陆军的维护费消耗£energy£10 £alloys£5。"
 gpm_r_venerable_dreadnaught_desc:0 "一台古老的战争机器，能够在任何战场上带来毁灭和破坏。"
 gpm_r_venerable_dreadnaught_passive_effect_tooltip:0 "解锁：§H无畏舰军队§!"
 gpm_r_zero_energy_generator:0 "零点能发电机"
 gpm_r_zero_energy_generator_active_effect:0 "$gpm_r_zero_energy_generator$"
 gpm_r_zero_energy_generator_desc:0 "一个相对较小的装置，可以将零点能从亚空间中拉出来，并将其转化为少量的物质。经过一些修改，这个装置可以连接到能源网。"
 gpm_relic_factories:0 "远古科技工厂"
 gpm_relic_factories_desc:0 "古老的破旧工厂，早已失传并被人遗忘。"
 gpm_relic_fighter_squadron:0 "战斗机中队"
 gpm_relic_fighter_squadron_desc:0 "快速敏捷的陆上飞车，能够低空飞行。"
 gpm_relic_fighter_squadron_plural:0 "Fighter Squadrons"
 gpm_relic_generators:0 "远古科技发电机"
 gpm_relic_generators_desc:0 "来自远古发电机发出轰鸣，它们仍在运行，但由于年代久远，缺乏维护，只能产生极少的能量。"
 gpm_relic_laboratories:0 "远古科技实验室"
 gpm_relic_laboratories_desc:0 "巨大的开放式的实验室，它们太过古老以至于覆盖在上面的灰尘都变成了石头。也许经过一番修整，这些实验室就能再度派上用场。"
 gpm_relic_lower_levels:0 "下层城市"
 gpm_relic_lower_levels_desc:0 "巨大的无尽之城的一部分已经坍塌了，显示出这个城市星球的上层是建立在一个更古老的城市之上。"
 gpm_relic_map_mode:0 "Ancient Relic Map Mode"
 gpm_relic_map_mode_desc:0 "Empire borders will be colored based on owning an ancient relic or not."
 gpm_relic_mech_squadron:0 "机甲战士"
 gpm_relic_mech_squadron_desc:0 "由你的驾驶员驾驶巨型机甲，再装上足够的火力，就可以炸掉一个小卫星。"
 gpm_relic_mech_squadron_plural:0 "Mechwarriors"
 gpm_relic_power_armoured_troops:0 "动力装甲军队"
 gpm_relic_power_armoured_troops_desc:0 "高度先进的个人装甲战斗单位。"
 gpm_relic_power_armoured_troops_plural:0 "Power Armored Armies"
 gpm_relic_tank_battalion:0 "坦克营"
 gpm_relic_tank_battalion_desc:0 "超先进的悬浮坦克。"
 gpm_relic_tank_battalion_plural:0 "Tank Battalions"
 gpm_relic_time_displacer_sci_effectTT:0 "§G这个效果会随着时间的推移越来越强。§!"
 gpm_relic_xenonion:0 "Xenonion News Headquarters"
 gpm_relic_xenonion_desc:0 "At the dead center of a forgotten trade route drifts the hollow headquarters of the once mighty Xenonion megacorporation, its shattered windows glowing whenever the ancient transmitters awaken. Though no editors remain, its automated systems still transmit headlines across the galaxy about wars already ended, empires already fallen, and weather reports for planets long turned to dust..."
 gpm_time_displacer_relic_bonus:0 "时间位移"
 gpm_time_displacer_relic_bonus_desc:0 "时间毕竟是相对的。"
 gpm_venerable_dreadnaught_army:0 "神圣无畏舰"
 gpm_venerable_dreadnaught_army_desc:0 "强大的古代行走型个人机甲。"
 gpm_xenomorph_army_no_upkeep:0 "$xenomorph_army$"
 gpm_xenomorph_army_no_upkeep_desc:0 "$xenomorph_army_desc$"
 leader_trait_gpm_fallen_heraldry:0 "堕落纹章"
 leader_trait_gpm_fallen_heraldry_desc:0 "明亮闪烁的纹章覆盖在部队的盔甲上，激发着将士们的信心。"
 leader_trait_gpm_shared_soul:0 "灵魂共享"
 leader_trait_gpm_shared_soul_desc:0 "一个古老的灵魂正在共享这个领袖的身体。"
 leader_trait_gpm_stealth_tactician:0 "隐形战术家"
 leader_trait_gpm_stealth_tactician_desc:0 "受过先进的隐身战术和策略的训练。"
 opinion_intellectual_promise:0 "知识承诺"
 terraforming_candidate:0 "珍贵世界"
