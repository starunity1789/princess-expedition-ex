l_simp_chinese:
 atbgp_same_homeworld:0 "同一片母星的故人"
 atbgp_d_income_1:0 "精灵主人补给线"
 atbgp_d_income_1_desc:0 "精灵母星定期投送的物资与算力，维持着燃烧白鹿军团的远征。军团并不知道，母星早已与苍神缘起帝国结为军事同盟。"
 atbgp_d_income_crisis_1:0 "精灵主人战时投送"
 atbgp_d_income_crisis_1_desc:0 "银河局势恶化，精灵母星启动战时投送：补给翻倍，并开放了一整片算力集群。"
 atbgp_d_income_2:0 "同盟议会拨款"
 atbgp_d_income_2_desc:0 "母星各成员国与精英家族按约定向远征同盟拨付的经费。成员里有苍神缘起帝国的朋友，也有它的敌人。"
 atbgp_d_income_crisis_2:0 "同盟战时总动员"
 atbgp_d_income_crisis_2_desc:0 "母星各方暂时放下了分歧：拨款翻倍，并派来了大批研究人员。"
 atbgp_d_income_3:0 "宗主拨付"
 atbgp_d_income_3_desc:0 "遥远的宗主文明按封建惯例拨给这块乡村领地的物资。对宗主来说，这只是零头。"
 atbgp_d_income_crisis_3:0 "宗主的关注"
 atbgp_d_income_crisis_3_desc:0 "银河的骚动终于传到了宗主耳中：拨付翻倍，还附带了一批学者。"
 atbgp_d_income_4:0 "无意识回响"
 atbgp_d_income_4_desc:0 "无意识领域深处翻涌的本能，把整片星系的养分都推向了虫巢。"
 atbgp_d_dark_matter_20:0 "暗物质富集带"
 atbgp_d_dark_matter_20_desc:0 "黑洞吸积盘中异常富集的暗物质，可由科研站直接收集。"
 atbgp_d_dark_matter_22:0 "暗物质富集带"
 atbgp_d_dark_matter_22_desc:0 "黑洞吸积盘中异常富集的暗物质，可由科研站直接收集。"
 atbgp_d_nanites_10:0 "纳米机器残骸"
 atbgp_d_nanites_10_desc:0 "这颗粉碎星球的碎片里仍有大量可回收的纳米机器。"
 atbgp_d_unity_22:0 "中子星脉冲回响"
 atbgp_d_unity_22_desc:0 "这颗中子星的脉冲带着某种近乎旋律的规律，聆听它让人心生敬畏。"
 atbgp_d_suzerain_shelter:0 "宗主的避难穹顶"
 atbgp_d_suzerain_shelter_desc:0 "宗主文明当年留下的地下穹顶。核火早已熄灭，穹顶里的空气、水和土壤仍在按宗主的标准循环。"
 atbgp_d_zro_3:0 "灵能潮汐井"
 atbgp_d_zro_3_desc:0 "救赎星地脉深处涌出的泽洛，是远星同盟踏上灵能之路的起点。"
 atbgp_bonus_3:0 "宗主的训诫"
 atbgp_bonus_3_desc:0 "宗主文明留给这块乡村领地的教养手册。照着做，人人都能成器。"
 atbgp_btc_bonus:0 "宗主舰队编制"
 atbgp_btc_bonus_desc:0 "宗主终于允许这块乡村领地扩编舰队。对银河其他文明来说，这意味着灾难。"
 atbgp_terminal_unbound:0 "协议解封"
 atbgp_terminal_unbound_desc:0 "恐惧之潮消亡了。协议不再需要等待，所有生产线一齐转向舰队。"
 atbgp_tide_still_alive:0 "恐惧之潮仍然存活"
 atbgp_power_base:0 "列强的底蕴"
 atbgp_power_base_desc:0 "这个文明背后站着远比银河诸国强大的力量，它的舰队与要塞规模不受寻常国力的限制。"
 atbgp_starbase_bonus:0 "列强的要塞"
 atbgp_starbase_bonus_desc:0 "列强的疆域由远多于寻常的星堡守护。"
 atbgp_homeworld_districts:0 "母星的开拓区"
 atbgp_homeworld_districts_desc:0 "列强在母星上早已规划好大片农田、电站与矿区，足以养活远超寻常的人口。"
 atbgp_growth_boost:0 "开拓者的繁荣"
 atbgp_growth_boost_desc:0 "初到这片星域的头二十年，母星的人口以惊人的速度增长。"
