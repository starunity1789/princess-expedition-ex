 kappa_expanded_shipyard:0 "河童扩展船坞"
 kappa_expanded_shipyard_desc:0 "生产：£food£10.00\n通过河童的葫芦科植物有机催化技术进行合金的二次熔解，极大程度上增强合金的可塑性，任何奇怪的舰船配件设计都能适配，船坞效率直升300%。\n\n战列舰造完后，泰坦还能接着造，一节更比三节强！\n\n"
 koishi1:0 "自我封闭内心的觉妖怪，获得了在无意识下进行行动的能力，来自位于地底的地灵殿。"
 koishi1_catch_phrase:0 "我和你无冤无仇，但我就送给你死在路旁的未来吧。不用担心，尸体我会让猫运走，你就可以永远地住在我家了！"
 kosuzu1:0 "借书屋铃奈庵的店主女儿兼店员，带着收集书籍的狂热来到了我们的国家。"
 kosuzu1_catch_phrase:0 "果然，我和一般人是不一样的呀！我一直憧憬着这样充满刺激的生活呢！"
