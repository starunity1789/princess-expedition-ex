 civic_moriya_shinto_corp_effects:0 "-拥有§Y东风谷早苗§!作为起始科学家。\n-£pop£ §Y唯心主义人口§!会为所有行星与分部提供额外的£trade_value£ §Y$TRADE_VALUE$§!。\n-可以建造£building£ §Y$building_temple_of_prosperity$§!$BRANCH_OFFICE_BUILDING$。\n-降低£building£§Y守矢分社§!的建造要求。"
