 civic_moriya_shinto_effects:0 "-拥有§Y东风谷早苗§!作为起始指挥官。\n-若非§Y唯心主义§!则§Y官僚§!建筑替换为§Y寺庙§!，若为§Y唯心主义§!则祭司产生的$r_unity$§G+1§!。\n-降低£building£§Y守矢分社§!的建造要求。\n—拥有['concept_weather_forecasting_mode']\n—$ADDITONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—£physics£ ['technology:tech_storm_prediction_1']"
 civic_nether_world:0 "忘川冥域"
 civic_nether_world_corp:0 "无寿就业"
 civic_nether_world_corp_desc:0 "这一社会和某位冥界的主人达成了交易，作为冥界人口过剩的解决方案接受该银河的死者，不仅获得了廉价的亡灵劳工，就算活着的劳工也可以在死后继续上班了。"
 civic_nether_world_corp_effects:0 "拥有§Y魂魄妖梦§!作为起始指挥官。\n能够建造£building£§Y$building_posthumous_employment_center$§!，提供$job_reassigner_plural$，$job_reassigner_effect_desc$\n被击败的有机体星神兽有机会被复活。\n大大提高§Y西行寺幽幽子§!来访的概率。"
 civic_nether_world_desc:0 "这一社会和某位冥界的主人达成了交易，作为冥界人口过剩的解决方案接受该银河的死者，其居民获得了死后继续在自己的国家生活的权利。"
 civic_nether_world_effects:0 "拥有§Y魂魄妖梦§!作为起始指挥官。\n被击败的有机体星神兽有机会被复活。\n大大提高§Y西行寺幽幽子§!来访的概率。"
 civic_penglai_medcine:0 "蓬莱科技"
 civic_penglai_medcine_corp:0 "蓬莱药企"
 civic_penglai_medcine_corp_desc:0 "这一寰宇企业接受了神秘的“蓬莱药局”的医疗和科技支持，从而在进入太空之初就获得了科技优势，并作为在这个世界销售其服务的代理人。"
 civic_penglai_medcine_corp_effects:0 "拥有§Y铃仙·优昙华院·因幡§!作为起始指挥官。\n在开始时就拥有§Y£society_research£ $tech_genome_mapping$§!、§Y£society_research£ $tech_gene_tailoring$§!和§Y£society_research£ $tech_frontier_health$§!科技。\n£job_healthcare£§Y$job_healthcare_plural$§!产出的$r_amenities$：§G+2§!\n£job_healthcare£§Y$job_healthcare_plural$§!产出的$r_trade_value$：§G+4§!\n可以建造£building£§Y$building_corporate_clinics$§!$BRANCH_OFFICE_BUILDING$"
 civic_penglai_medcine_desc:0 "这一社会接受了神秘的“蓬莱药局”的医疗和科技支持，从而在进入太空之初就获得了科技优势，代价则是需要为他们的实验性疗法提供测试。"
 civic_penglai_medcine_effects:0 "拥有§Y铃仙·优昙华院·因幡§!作为起始指挥官。\n在开始时就拥有§Y£society_research£ $tech_genome_mapping$§!、§Y£society_research£ $tech_gene_tailoring$§!和§Y£society_research£ $tech_frontier_health$§!科技。\n£job_healthcare£§Y$job_healthcare_plural$§!产出的$r_amenities$：§G+5§!"
 civic_scarlet_allience:0 "红魔眷族"
 civic_scarlet_allience_corp:0 "红魔眷族"
 civic_scarlet_allience_corp_desc:0 "这一寰宇企业与异世界的吸血鬼达成了契约，作为其在这个世界赚取利润的代理人，他们接受了饱含魔力的血液以增强力量，同时吸血鬼还派遣了最信任的女仆长来协助——或者监视他们。"
 civic_scarlet_allience_corp_effects:0 "拥有§Y十六夜咲夜§!作为起始指挥官。\n获得§Y斯卡蕾特眷族§!特质。"
 civic_scarlet_allience_desc:0 "这一社会与异世界的吸血鬼达成了契约，作为其在这个世界扩张的先驱，他们接受了饱含魔力的血液以增强力量，同时吸血鬼还派遣了最信任的女仆长来协助——或者监视他们。"
 civic_scarlet_allience_effects:0 "拥有§Y十六夜咲夜§!作为起始指挥官。\n获得§Y斯卡蕾特眷族§!特质。"
