 hina1:0 "收集厄运的神明。所谓的疫病神。不管是人类还是妖怪只要靠近了她就会变得不幸。但是，她本人却完全没有恶意。倒不如说她是个待人友好的神明。收集厄运的本意，也只是为了不让厄运转移到人类身上。"
 hina1_catch_phrase:0 "我是人类的朋友，收揽人类的苦厄，并将其交诸众神。如果你需要的话，我也可以代你承受所有的灾厄哦。"
 kanako1:0 "神圣而庄严的神明，身后的注连绳十分惹眼。虽然拥有着山神的御神德，但她的行为似乎超出了传统意义上的神明。"
 kanako1_catch_phrase:0 "信仰并获得回报——以我所定义的方式。"
 kappa_archivist_desc:0 "来自河童轨道开发集团的科学专员，精通于探索和工程监管。"
 kappa_enclave_achivist_already:0 "我们已经招募过一个河童科学专员了。"
 kappa_enclave_construction_already:0 "我们离上一次签订建设项目合同不满两年"
