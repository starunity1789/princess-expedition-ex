 civic_hakurei_shinto_corp_desc:0 "这一寰宇企业追奉无数籍籍无名的泛神，以及世间的被遗忘之物。"
 civic_hakurei_shinto_corp_effects:0 "-拥有§Y博丽灵梦§!作为起始指挥官。\n-£pop£ §Y唯心主义人口§!会为所有行星与分部提供额外的£trade_value£ §Y$TRADE_VALUE$§!。\n-可以建造£building£ §Y$building_temple_of_prosperity$§!$BRANCH_OFFICE_BUILDING$。\n-起始在首都获得§Y博丽神社§!星球特征，可通过决议升级。"
 civic_hakurei_shinto_desc:0 "这一社会追奉无数籍籍无名的泛神，以及世间的被遗忘之物。"
 civic_hakurei_shinto_effects:0 "-拥有§Y博丽灵梦§!作为起始指挥官。\n-若非§Y唯心主义§!则§Y官僚§!建筑替换为§Y寺庙§!，若为§Y唯心主义§!则祭司产生的$r_unity$§G+1§!。\n-起始在首都获得§Y博丽神社§!星球特征，可通过决议升级。"
 civic_hifuu:0 "秘封少女俱乐部"
 civic_hifuu_desc:0 "这一文明在前太空阶段意外的遇到了两名跨越梦与现，自遥远未来而来的客人。带着对浩瀚星宇深处的秘密的共同渴望，文明最优秀的航天科学家和她们合作，仿造来自那个遥远“科学世纪”的跃迁技术，研制了早期型号的太空探索飞船。"
 civic_hifuu_effects:0 "§R开局将陷入科技和基础设施的劣势，£pops£人口比正常开局要少10！§!\n开局拥有2艘分别由§Y玛艾露贝莉·赫恩§!和§Y宇佐见莲子§!驾驶的§H$explorer_vessel_plural$§!，以及一艘配备§H亚空间引擎§!的§H$engineer_vessel$§!，这使它们无法进行超空间旅行，但能提供有限的跃迁引擎能力，且在遇险时可以传送至另一位成员身边。\n观测前超光速文明可获得额外§G50%§!的洞见进度。\n每次完成建立第一次接触可获得£unity£§H凝聚力§!。"
 civic_kirisame_magic:0 "雾雨之友"
 civic_kirisame_magic_corp:0 "雾雨之友"
 civic_kirisame_magic_corp_desc:0 "在这一寰宇企业进入太空前不久，一位路过的普通魔法使遇到了他们，并饶有趣味地加入了他们的商业企划。"
 civic_kirisame_magic_corp_effects:0 "拥有§Y雾雨魔理沙§!作为起始指挥官。\n在开始获得一艘装备§YMaster Spark§!的特殊§Y驱逐舰§!。"
 civic_kirisame_magic_desc:0 "在这一社会进入太空前不久，一位路过的普通魔法使遇到了他们，并饶有趣味地加入了他们的太空探索。"
