 leader_trait_thl_cultural_focus_desc:0 "这位领袖对促进文化发展和艺术事业深感兴趣。"
 leader_trait_thl_pop_focused:0 "高效员工"
 leader_trait_thl_pop_focused_desc:0 "这位领袖知道经验丰富的支援型员工的价值和重要性。"
 leader_trait_trickster:0 "诡术师"
 leader_trait_trickster_desc:0 "这位领袖懂得如何出其不意，攻其不备，利用战略战术误导来取得优势。"
 leader_trait_unyielding:0 "坚强不屈"
 leader_trait_unyielding_desc:0 "这位领袖宁可战死也不退缩。"
 leader_trait_wholehearted:0 "全身全灵"
 leader_trait_wholehearted_desc:0 "这位领袖性格认真直率，对于所做的事极度专注，这种精神也鼓舞着我们的士兵们，甚至在战死后。"
 leader_trait_wholehearted_effect:0 "$ARMY_EFFECTS_TXT$：\n$t$己方部队战死时：\n$tt$作为灵体部队复活的概率：§Y50%§!\n$FLEET_EFFECTS_TXT$：\n$t$战斗中每损失§Y1§!艘战舰：\n$tt$舰船武器射速：§G+2%§!\n\n从战斗中的舰队和陆军伤亡中获取§E灵魂§!资源。"
 marisa1:0 "普通的魔法使，在偷窃行为被发现后经谈判加入我们，擅长光与热的魔法。"
 marisa1_catch_phrase:0 "弹幕最重要的是火力DA☆ZE！"
 meiling1:0 "来自未知国度"中国"的妖怪，受红魔馆馆主蕾米莉亚·斯卡蕾特的派遣来到此地。"
 meiling1_catch_phrase:0 "承蒙关照，只是个做门卫的普通人哦。"
 merry1:0 "来自科学世纪的一名少女，专攻相对性精神学，灵异社团秘封俱乐部的成员之一。"
 merry1_catch_phrase:0 "梦与现是相同的东西，这边和那边的世界，哪个是梦也说不定哦。"
 minoriko1:0 "掌管幻想乡秋天的八百万神之一，掌管着丰收，是丰收之神。"
 minoriko1_catch_phrase:0 "马上就到秋天了——食物会变得越来越好吃哦——今天就让我特别为你们提早带来秋天的味觉吧——"
 mod_doll_control_limit:0 "人偶控制上限"
 mod_planet_researchers_minor_artifacts_produces_add:0 "£job_researcher£[GetResearcherPlural]产出的£minor_artifacts£ $minor_artifacts$"
 modifier_kappa_construction:0 "河童重工建设有限公司"
 modifier_kappa_robot:0 "河童机器人生产线"
 mystia1:0 "地下偶像兼职小吃摊“深夜雀食堂”老板娘，她的歌声能够使得生物失去感光能力。"
 mystia1_catch_phrase:0 "总之，快乐的妖怪祭就要开始了哦。"
 nitori1:0 "在妖怪之山居住的河童，是个刻板印象里的技工，发现人造物体会立刻拆开，然后再组装好。为此，她的衣服里装着密密麻麻的工具。"
 nitori1_catch_phrase:0 "你有好多有趣的东西嘛，稍微让我—看—看—嘛—"
 onoduka1:0 "三途河的船夫，尽管并不急需工作，但由于其上司的影响还是前来为我们效力了。"
 onoduka1_catch_phrase:0 "既然活着就洒脱点吧，心里太郁闷了也可能会死啊。"
 patchouli1:0 "原居住于红魔馆的大魔法使，红魔馆馆主的友人，受其介绍来担任我们的魔法顾问。"
 patchouli1_catch_phrase:0 "魔法的本质是追究万物的根源，这点魔法和科学可没区别哟。"
 reimu1:0 "博丽神社的巫女，因为紫的恶作剧出现于此，弹幕战的专家。"
 reimu1_catch_phrase:0 "敌人什么的，只要统统退治掉就行啦！"
 reisen1:0 "地上的月兔，受她的师傅八意永琳的派遣来到这里，过去有一段不愿提起的从军经历。"
 reisen1_catch_phrase:0 "就算在前面等着我的是噩梦，我也只能前进。因为这就是我的工作，工作是必须要遵守的。"
 remilia1:0 "自称前来征服这个世界的吸血鬼，红魔馆的主人，她和她的支持者会不断为夺取权力制造麻烦，然而若利用得当，她会成为我们强大的助力。"
 remilia1_catch_phrase:0 "对我来说重要的东西只有质量和品位。而你的统治，所欠缺的就是这方面上的那么一点点罢了。"
 renko1:0 "来自科学世纪的一名少女，专攻超统一物理学，灵异社团秘封俱乐部的成员之一。"
 renko1_catch_phrase:0 "来吧，睁开双眼吧。梦是可以变成现实的。我们来把梦境世界变成现实吧！"
 rin1:0 "栖息在火焰中的火车，喜欢收集尸体，但对已埋葬的尸体不感兴趣，因为讨厌很长的名字而总让别人称呼自己“阿燐”。"
 rin1_catch_phrase:0 "锵锵～～大哥大姐，好像在做什么愉快的事呢！算咱一个可以么？"
 sakuya1:0 "吸血鬼洋馆——红魔馆的女仆长，另一个时间中的她依然在主持红魔馆中的大小事务——那里离不开她，而这个时间的她代表红魔馆为我们服务。不同时间线之间的她的关系依然成谜，就像她的身世一般。"
 sakuya1_catch_phrase:0 "忠实的仆从懂得鞭挞，我也不例外。"
 sanae1:0 "守矢神社的风祝，为传播信仰而来。拥有引发奇迹的能力，对自己的能力相当自信，完全不把常识放在眼里。"
 sanae1_catch_phrase:0 "这里就靠我东风谷早苗的奇迹！"
 satori1:0 "旧地狱怨灵管理机构地灵殿的主人，在宠物的建议下放弃了闭门不出的生活。"
 satori1_catch_phrase:0 "在我面前你什么事都隐瞒不了哟，因为，你的心中所想，我全部都听得见……"
 shikieiki1:0 "来自是非曲直厅的阎魔，因为地狱的财政危机处于待业状态，来我们这里寻求工作。"
 shikieiki1_catch_phrase:0 "将国家治理的井然有序，这就是现在的你要积累的善行。"
 sizuha1:0 "掌管幻想乡秋天的八百万神之一，掌管着红叶，是红叶之神。"
 sizuha1_catch_phrase:0 "树叶啊，总让人觉得到了秋天才会变成红色，但其实从发芽的时候，它们就开始带上了美丽而虚幻的鲜红哦。"
 subclass_commander_lord:0 "领主"
 subclass_commander_lord_desc:0 "这些领主在幻想乡皆是叱咤风云的大人物，统领着占据幻想乡一方的势力，她们的领袖魅力和领导才能仿佛与生俱来。"
 subclass_commander_servant:0 "从者"
 subclass_commander_servant_desc:0 "幻想乡的从者们为她们的主人承担战斗和管理的责任，她们的行政技巧可以避免大军驻扎带来的负面效应。"
 subclass_commander_thl_miko:0 "巫女"
 subclass_commander_thl_miko_desc:0 "打击异变，维持秩序，传播信仰，这些都是巫女的责任，比起舰队司令，她们的战术更加灵活，丰富的弹幕战经验使得她们可以轻易避开敌人的火力，比起督管专员，她们的手段更加巧妙，通过信仰、怀柔和必要的定点打击，叛乱和犯罪将被消弭于无形，而不影响当地生产秩序。"
 suika1:0 "鬼族四天王之一，为了取回人类和鬼之间的信任踏上了旅程，喜欢宴会和酒，天真而且非常单纯。"
 suika1_catch_phrase:0 "让百鬼夜行开始吧，今后每晚都将是热闹美好的夜晚！"
 suwako1:0 "像青蛙一样幼小可爱的谜之神明，性格似乎难以捉摸，或许有着阴暗的另一面也说不定。"
 suwako1_catch_phrase:0 "啊—呜——"
 tech_final_spark:0 "Final spark"
 tech_final_spark_desc:0 "毫无保留地发射出大功率的激光，直击所能造成的巨大威力无愧于其高消费。"
 tech_master_spark:0 "Master spark"
 tech_master_spark_desc:0 "雾雨魔理沙的著名符卡的复刻版，我们把超巨大的魔法镭射搬到了舰船上。"
 tenshi1:0 "比那名居家的长女，厌倦了天界的无聊生活，选择了出来闯荡（实际上是因为偷吃仙丹被流放了）。"
 tenshi1_catch_phrase:0 "空中的天气、大地的安定、人的气质——全都在我手掌之上！"
 tewi1:0 "自称来自迷途竹林，是竹林中野生的兔子与妖怪兔的领袖，一个巧言令色的欺诈师和恶作剧爱好者，据说能带给见到她的人以幸运。"
 tewi1_catch_phrase:0 "大家，听我的话会变得更幸福的，肯定会的哟~。"
 thl_leader_exorcism_roud:0 "驱魔棒：长"
 thl_leader_exorcism_roud_2:0 "驱魔棒：更长"
 thl_leader_exorcism_roud_2_desc:0 "这位领袖随身携带的驱魔棒被确认在随着战斗增长，并通过某种奇妙的灵能联系增加了舰队武器的攻击范围。"
 thl_leader_exorcism_roud_3:0 "驱魔棒：超长"
 thl_leader_exorcism_roud_3_desc:0 "这位领袖随身携带的驱魔棒还在不停的增长着，我们不得不增加了旗舰舱室的高度！"
 thl_leader_exorcism_roud_desc:0 "这位领袖随身携带的驱魔棒似乎在随着战斗增长，船员汇报的战舰射程的增加被怀疑与此有关。"
 thl_leader_trait_bird_brain:0 "笨蛋"
 thl_leader_trait_bird_brain_desc:0 "这位领袖是个笨蛋。"
 thl_leader_trait_blood_magic:0 "绯红之主"
 thl_leader_trait_blood_magic_desc:0 "这位领袖掌握了唯有吸血鬼一族才能使用的鲜血之魔法，以蝙蝠和矢为武器作战。"
 thl_leader_trait_blood_magic_effect:0 "解锁§Y全世界梦魇§!法令，献祭§R1§!个£pop£人口（优先失业的和被奴役的）在舰队所在恒星系中制造持续§Y360§!天的§Y法阵§!：\n阻碍§Y探测器§!\n持续释放§Y蝙蝠攻击§!\n解锁§Y红色的幻想乡§!法令，献祭§R2§!个£pop£人口（优先失业的和被奴役的）在舰队所在恒星系中制造持续§Y1800§!天的§Y红雾§!：\n阻碍§Y探测器§!\n大幅降低敌方§Y命中§!和§Y索敌§!\n持续侵蚀敌方§Y船体§!和§Y装甲§!\n持续修复己方§Y船体§!和§Y装甲§!"
 thl_leader_trait_bloody_charm:0 "血色魅力"
 thl_leader_trait_bloody_charm_desc:0 "这位领袖因其种族特性和强大的力量会引发其他个体不自觉的仰慕。"
 thl_leader_trait_books:0 "妖魔本的收集者"
 thl_leader_trait_books_desc:0 "这位领袖痴迷于收集奇怪的乃至危险的知识，尤其是以书本的形式。"
 thl_leader_trait_books_effect:0 "$PLANET_EFFECTS_TXT$：\n$mod_planet_researchers_minor_artifacts_produces_add$：§G+0.2§!\n\n$SECTOR_EFFECTS_TXT$：\n$mod_planet_researchers_minor_artifacts_produces_add$：§G+0.1§!\n\n$SCIENCE_SHIP_EFFECTS_TXT$：\n$tt$考古发掘速度：§G+50%§!\n§Y古代文明异常现象：§!\n$t$异常点研究速度：§G$@trait_archaeologist_1_amt|%0$§!\n\n允许建造£building£§Y铃奈庵§!，这一建筑会按照已经发掘的考古遗迹数量提供§Y铃奈庵员工§!岗位，产出$r_research$和£minor_artifacts£§Y$minor_artifacts$§!，并向£job_researcher£$job_researcher_plural$提供借书服务以收取$r_energy$。\n在协助研究的星球允许§Y解封古代妖魔§!决议，可以消耗£minor_artifacts£§Y$minor_artifacts$§!召唤拥有§Y灵能§!、§Y博闻强识§!和§Y非常强壮§!特质的强大£pop£§Y人口§!，但有些时候需要先通过§Y陆地战斗§!制服他们。"
 thl_leader_trait_border_merry:0 "看得见结界的能力"
 thl_leader_trait_border_merry_desc:0 "这位领袖能够发现隐藏在世界中的境界线。"
 thl_leader_trait_bridge_of_gensokyo:0 "幻想乡的桥梁"
 thl_leader_trait_bridge_of_gensokyo_desc:0 "这位领袖了解人类与妖怪平和的交流的幻想乡中众多不同的种族及其传承，知道如何在礼仪上把握文化上的细微差别，同样的经验可以运用在我们的外交上。"
 thl_leader_trait_bridge_of_gensokyo_effect:0 "该特质的加成会随等级增长而成倍提高。"
 thl_leader_trait_century_of_science:0 "科学世纪"
 thl_leader_trait_century_of_science_desc:0 "这位领袖拥有着来自一个科学昌明而信息科技高度发达的世纪的知识。"
 thl_leader_trait_common_sense_killer:0 "常识抹杀者"
 thl_leader_trait_common_sense_killer_desc:0 "这位领袖并不为常识所束缚。"
 thl_leader_trait_common_sense_killer_effect:0 "将§Y唯心主义§!与§Y唯物主义§!之间的好感减成反转为加成。\n完成科技研发时，获得等于§Y1§!个月产出的$r_unity$。"
 thl_leader_trait_convenience_house:0 "河中的便利屋"
 thl_leader_trait_convenience_house_desc:0 "河童们的技术力不允许她们放过任何一个商机，科技为生活带来了巨大的便利，也彻底改变了生活的方式，只要是你生活中用得到的，就没有从河童那里买不到的，如果有，那是你钱没给够。"
 thl_leader_trait_corpse_manipulation:0 "死灰复燃"
 thl_leader_trait_corpse_manipulation_desc:0 "阿燐捕捉和操纵尸体和怨灵的能力可以轻易将大批大批的死者拉起来战斗或工作，亦可以把生者毫无破绽的扮成死者。"
 thl_leader_trait_corpse_manipulation_effect:0 "§H所在星区§!能够建造£building£§Y尸体处理中心§!，这一建筑会利用星球上死去的尸体组装§Y僵尸§!及§Y怨灵§!£pop£人口，同时会将星球的防御部队替换为§Y地狱不死军§!，比通常的§Y不死军§!更加强大。\n存在£building£§Y尸体处理中心§!时，失业的§Y僵尸§!£pop£人口可以进行§P化学处理§!以产生$r_energy$。\n可以在§H所在星球§!或有£building£§Y尸体处理中心§!的星球招募§Y地狱不死军§!。"
 thl_leader_trait_corpse_travel:0 "带走尸体程度的能力"
 thl_leader_trait_corpse_travel_desc:0 "阿燐推着的车是猫车。你问她在运什么？你一定会想要是不问的话就好了。"
 thl_leader_trait_corpse_travel_effect:0 "§E拥有该领袖时§!：\n被击败的有机体星神兽有机会被复活。"
 thl_leader_trait_cost_for_work:0 "钱和死一样沾得越多就越忙"
 thl_leader_trait_cost_for_work_desc:0 "这位领袖宁愿掏钱上班也要坚持在上班时摸鱼。"
 thl_leader_trait_crimson_sword:0 "绯想剑"
 thl_leader_trait_crimson_sword_desc:0 "这位领袖手中的绯想剑能将对手的气质雾化并转换为某种具体形态（天气），能洞察对手气质的弱点并转化为性质缠绕，准确无误地将弱点击中。"
 thl_leader_trait_crimson_sword_effect:0 "$t$太空战斗开始时：\n$tt$为星系内§Y所有敌方舰队§!提供随机§R环境危害效果§!。"
 thl_leader_trait_cyborg_life:0 "自我更新"
 thl_leader_trait_cyborg_life_desc:0 "这位领袖通过不断升级自身的义体实现了永生。"
 thl_leader_trait_dance:0 "蝴蝶梦之舞"
 thl_leader_trait_dance_desc:0 "这位领袖继承了西行歌圣的艺术造诣，并结合了冥界的独特审美和死生观，创造了独属于她一人的歌舞艺术风格。"
 thl_leader_trait_death:0 "操纵死亡程度的能力"
 thl_leader_trait_death_desc:0 "这位领袖能够引诱死亡，并很简单地将人置于死地，还能操纵死后的幽灵。"
 thl_leader_trait_death_effect:0 "管理的星球和星区的人口产出§E灵魂§!资源。\n解锁£building£§Y冥界特异点§!建筑，可以消耗§E灵魂§!资源组装§H灵体§!£pop£§Y人口§!，其无需维护费用且占用的£housing£§Y住房§!减半，但不擅长生产$r_minerals$和$r_food$。"
 thl_leader_trait_density:0 "操纵疏密程度的能力"
 thl_leader_trait_density_desc:0 "这位领袖的能力可以使自身雾化躲避攻击，在呼吸间制造出大量小型分身，将自身变为雾气用于监视或侦察，或是萃集起人心来使居民更加团结一致，甚至能直接通过聚集的能力吸引移民。"
 thl_leader_trait_density_effect:0 "可以在星球决议界面让萃香在当前星球变成一团可以进行§P太空战§!的§Y鬼雾§!，或者可以进行§V陆地战§!的§Y巨大化鬼王本体§!，它们的战斗力会随着萃香的§Y等级§!递增。\n\n§E参与、指挥或在轨支援陆地战时§!：\n每§Y10§!天生成一队§Y鬼王分身§!加入星球上的作战。\n\n$PLANET_EFFECTS_TXT$：\n$t$可以使用星球决议§Y永不停歇的宴会§!，以大大增加星球人口$r_consumer_goods$维护为代价，使星球从整个银河无条件吸引人口。\n$tt$§R如果在此过程中消费品陷入赤字，宴会中断的人口将极为不满！§!"
 thl_leader_trait_destined:0 "注定伟大"
 thl_leader_trait_destined_desc:0 "这位领袖的命运与她所在的帝国深刻联系在了一起。"
 thl_leader_trait_destiny_manipulation:0 "操纵命运程度的能力"
 thl_leader_trait_destiny_manipulation_desc:0 "这位领袖会在有意无意间，际遇周围的不幸命运，搭上一句话，就能令对方生活发生重大变化。"
 thl_leader_trait_destiny_manipulation_effect:0 "每5年：\n可以选择一个没有§H命定特质§!的§Y领袖§!（随机抽取，等级不限，每个领域各抽取一个），为其添加一个随机的§H命定特质§!。"
 thl_leader_trait_detective:0 "犯规侦探觉"
 thl_leader_trait_detective_desc:0 "这位领袖会利用自己读心的能力协助侦破案件。"
 thl_leader_trait_distance:0 "操纵距离程度的能力"
 thl_leader_trait_distance_desc:0 "这位领袖可以对距离进行操纵。"
 thl_leader_trait_distance_effect:0 "解锁§Y无间之狭间§!法令，消耗$r_astral_threads$在§Y100§!天内§G大幅提高§!星系内我方舰船的§Y舰队武器射程§!，§R大幅降低§!敌方舰船的§Y舰队武器射程§!和§Y命中§!、§Y追踪§!。"
 thl_leader_trait_dolls:0 "操控人偶程度的能力"
 thl_leader_trait_dolls_desc:0 "这位领袖是一位能用魔法操控人偶，让它们表现得栩栩如生的技艺精湛的魔法使。"
 thl_leader_trait_dolls_effect:0 "解锁独特的§Y人偶§!科技线，§Y人偶§!类似机器人，但维护成本更低，总是能够担任§Y£job_entertainer£$job_entertainer_plural$§!和£job_servant£§Y$job_servant_plural$§!，且同时受§Y机器人产出§!和§Y人偶人口产出§!的加成，但在升级为知觉人偶前会受到 £mod_doll_control_limit£ §Y$mod_doll_control_limit$§!的限制。"
 thl_leader_trait_earth:0 "创造坤程度的能力"
 thl_leader_trait_earth_desc:0 "这位领袖能改变地形，带来丰穰，庇佑生育，只是其神力需要人民的信仰心加持。"
 thl_leader_trait_earthquake:0 "操纵大地程度的能力"
 thl_leader_trait_earthquake_desc:0 "这位领袖作为比那名居家族的一员，可以通过插下或拔起要石来镇压或引发地震。"
 thl_leader_trait_earthquake_effect:0 "$t$在驻扎的星球可以使用§Y插下要石§!决议移除§Y$unstable_tectonics$§!行星修正，或使用§Y拔出要石§!决议添加§Y$unstable_tectonics$§!行星修正，此类决议会添加一个新的$r_minerals$§Y行星特征§!，且只能选择一个执行一次。\n$t$地面战斗登陆时：\n$tt$对行星造成§Y50%§!的破坏度，每支敌军都有§Y50%§!概率被消灭，并在2年内降低星球防御部队的士气和生命（在此期间地震无法再次发动）。"
 thl_leader_trait_elements:0 "操纵火＋水＋木＋金＋土＋日＋月的程度的能力"
 thl_leader_trait_elements_desc:0 "这位领袖熟练掌握了多种元素魔法，并能对其进行组合创造新的魔法。"
 thl_leader_trait_elements_effect:0 "允许建造£building£§H炼金催化器§!建筑，这一类建筑会消耗$r_zro$为星球提供巨大生产加成，每种限§Y1§!座，最多建造§Y7§!座。"
 thl_leader_trait_engineer_in_water:0 "水中的技师"
 thl_leader_trait_engineer_in_water_desc:0 "整个河童群体的手艺都非常精巧，擅长制作道具。她们保留着其他物种难以理解的高级技术。"
 thl_leader_trait_excessive_reimu:0 "贪欲的贫乏巫女"
 thl_leader_trait_excessive_reimu_desc:0 "这位领袖对于常见的一般等价物似乎有着过于常人的执着，但似乎从未有因为贪欲而变得富裕而殷实的可能性。"
 thl_leader_trait_fall:0 "掌管红叶程度的能力"
 thl_leader_trait_fall_desc:0 "秋天是丰收的季节，也是红叶的季节。秋静叶司掌秋天的“收获”与“凋落”之中的“凋落”。"
 thl_leader_trait_fall_tooltip:0 "$SYSTEM_EFFECTS_TXT$：\n$t$当星系中有残骸被打捞或研究完成：\n$tt$打捞舰船的概率：§Y100%§!\n\n在秋静叶管理的星球或星区，每年§Y9§!月都会自动将一个£blocker£§Y自然星球障碍§!替换为£blocker£§Y红叶密林§!。\n\n解锁诸多可用的§r符卡§!。"
 thl_leader_trait_flower:0 "操纵花程度的能力"
 thl_leader_trait_flower_commander:0 "魔炮之祖"
 thl_leader_trait_flower_commander_desc:0 "这位领袖能够发射极度强力的魔法射束。"
 thl_leader_trait_flower_commander_effect:0 "解锁§H二重魔炮§!法令，在战场上召唤一个持续§Y360§!天的，装备两门§YFinal Spark§!的§Y法阵§!。"
 thl_leader_trait_flower_desc:0 "这位领袖能够对开花的植物进行操纵，让枯萎的花再度盛开，甚至在云端开出花朵。"
 thl_leader_trait_flower_effect:0 "允许在§Y非人工§!星球建造£district£§Y花田区划§!，提供£job_grower_drone£ §Y花农§!岗位，产出$r_food$、$r_consumer_goods$、$r_trade_value$和§Y£amenities£ $amenity$§!。"
 thl_leader_trait_fly:0 "在空中飞行程度的能力"
 thl_leader_trait_fly_desc:0 "这位领袖可以不受任何力的束缚，以惊人的机动性指挥其舰队躲避敌人的弹幕，力量的差异对她来说也毫无意义。"
 thl_leader_trait_fusion_energy:0 "梦幻般的能源"
 thl_leader_trait_fusion_energy_desc:0 "对阿空操控核聚变能力的研究能够改善我们国家的反应堆的结构，以提高我们战舰及发电厂的效率。"
 thl_leader_trait_fusion_energy_effect:0 "允许使用§H地热「核焰喷涌」§!星球决议在境内星球制造地热裂缝，提供额外的£district£§Y发电区划§!上限。\n允许通过一个议程提前获得£engineering_research£§Y戴森球§!科研选项。"
 thl_leader_trait_future_and_past:0 "§I明日之盛，昨日之俗§!"
 thl_leader_trait_future_and_past_desc:0 "这位领袖脑海中充斥着当年的辉煌与苦难，那历历在目的遥远往事将悲愤化作了力量。"
 thl_leader_trait_gardener:0 "冥界的园艺师"
 thl_leader_trait_gardener_desc:0 "这位领袖因为先前工作的原因，对园艺颇有造诣，能在所驻守的星球留下体现独特生死观的园艺作品。"
 thl_leader_trait_gene_life:0 "无限延寿"
 thl_leader_trait_gene_life_desc:0 "这位领袖通过不断的细胞再生手术以及配套的鸡尾酒疗法实现了永生。"
 thl_leader_trait_godness_of_war:0 "军神"
 thl_leader_trait_godness_of_war_desc:0 "军神带兵，多多益善。这位领袖是一位军神——字面意义上的。"
 thl_leader_trait_great_magician:0 "大魔法使"
 thl_leader_trait_great_magician_desc:0 "这位领袖的魔法造诣是如此高深，以至于魔力已经代替化学能/电能成为了[Root.GetHisHer]生命的源动力。"
 thl_leader_trait_gungnir:0 "神枪冈格尼尔"
 thl_leader_trait_gungnir_desc:0 "这位领袖持有的武器据说是北欧神话中奥丁的神枪——冈格尼尔，据说是。"
 thl_leader_trait_gungnir_effect:0 "解锁§Y必杀「Heart Break」§!法令，立刻对星系内单一目标造成§Y100000§!船体伤害，再次使用需要工程船对神枪进行回收。"
 thl_leader_trait_harvest:0 "掌管丰收程度的能力"
 thl_leader_trait_harvest_desc:0 "秋天是丰收的季节，也是红叶的季节。秋穰子司掌秋天的“收获”与“凋落”之中的“收获”。"
 thl_leader_trait_harvest_tooltip:0 "在秋穰子管理的星球，每年§Y9§!月都会一次性产出额外的£energy£ £minerals£ £food£§Y基础资源§!，相当于星球§Y9§!个月的产出，在秋穰子管理的星区，每年§Y9§!月都会一次性产出额外的£energy£ £minerals£ £food£§Y基础资源§!，相当于星球§Y3§!个月的产出。\n\n在以上地区，若$r_food$产出盈余，人口幸福度和凝聚力产出就会随着人均$r_food$的产量而提升。\n\n允许玩家改变§Y粮食政策§!，随着秋穰子等级的提高，§Y粮食政策§!的选择也会增加。\n\n解锁诸多可用的§r符卡§!。"
 thl_leader_trait_heaven:0 "创造乾程度的能力"
 thl_leader_trait_heaven_desc:0 "这位领袖能掌管刮风下雨，顺便带来丰收，只是其神力需要人民的信仰心加持。"
 thl_leader_trait_hifuu:0 "永远的秘封活动俱乐部"
 thl_leader_trait_hifuu_desc:0 "秘封俱乐部的活动使这位领袖对异常现象和古代遗迹有着充足的探索经验。"
 thl_leader_trait_ice:0 "操控冷气程度的能力"
 thl_leader_trait_ice_desc:0 "这位领袖可以用自己的能力加速舰队武器的冷却，或是直接拿来攻击敌人的星球。"
 thl_leader_trait_ice_effect:0 "$t$激活§B完美冻结§!轰炸姿态，这个轰炸姿态对陆军伤害较大，且会将星球转化为§B极地星球§!甚至§B冰封星球§!。"
 thl_leader_trait_incarnation_of_nature:0 "大自然的化身"
 thl_leader_trait_incarnation_of_nature_commander:0 "大自然的化身"
 thl_leader_trait_incarnation_of_nature_commander_desc:0 "这位领袖是自然的化身，可以加速舰体组织的自愈修复，并更高效的控制太空生物。"
 thl_leader_trait_incarnation_of_nature_desc:0 "这位领袖是自然的化身，能够与她所在星球的生物圈形成灵能联系并改善彼此。"
 thl_leader_trait_incarnation_of_nature_effect:0 "星球受到攻击时，若星球不是人工星球：\n每个未开发区划提供§Y2§!暴走森林防御部队，每个农业或花田区划提供§Y1§!暴走森林防御部队。"
 thl_leader_trait_information_war:0 "开口言是非 秋风吹唇寒"
 thl_leader_trait_information_war_desc:0 "这位领袖精于选取对自己有利的真相，并利用这些真相获取优势。"
 thl_leader_trait_information_war_effect:0 "允许在法令界面执行§Y天狗谍报行动§!，只要向任意国家派遣了任意建立间谍网的§Y特使§!且有对应方面的§Y高情报§!，即可花费§Y250§!$r_influence$执行以下行动之一：§E引导思潮§!、§G策划断交§!、§Y煽动叛乱§!、§B窃取科技§!、§R腐蚀士气§!。"
 thl_leader_trait_invincible:0 "操纵灵气程度的能力"
 thl_leader_trait_invincible_desc:0 "这位领袖天生具有强大的灵力，尽管在此方面修行不足，但也能轻易做到很多其他个体做不到的事。"
 thl_leader_trait_invincible_effect:0 "$t$解锁诸多可用的§r符卡§!。\n$t$激活§H梦想封印§!轰炸姿态，这个轰炸姿态对陆军伤害极大，且会将星球缓慢转化为§E屏障星球§!。"
 thl_leader_trait_iron_ass:0 "铁尻"
 thl_leader_trait_iron_ass_2:0 "铁尻 II"
 thl_leader_trait_iron_ass_2_desc:0 "这位领袖坚持认为加固后方装甲对于战舰的作战能力是必要的。"
 thl_leader_trait_iron_ass_3:0 "铁尻 III"
 thl_leader_trait_iron_ass_3_desc:0 "这位领袖坚持认为加固后方装甲对于战舰的作战能力是必要的。"
 thl_leader_trait_iron_ass_desc:0 "这位领袖坚持认为加固后方装甲对于战舰的作战能力是必要的。"
 thl_leader_trait_izakaya:0 "深夜雀食堂"
 thl_leader_trait_izakaya_desc:0 "在取得与我们政府合作的地位之后，米斯蒂娅开始了一系列雄心勃勃的计划以扩大夜雀食堂的商业版图，以主宰全国甚至全银河的小吃市场——据说在此之前，她就将夜雀食堂的分店开遍了幻想乡，甚至远至地底、卫星和异界。"
 thl_leader_trait_izakaya_tooltip:0 "\n如果国家使用$r_food$资源，则允许建造£building£§H夜雀食堂§!建筑，将$r_food$转化为$r_unity$、$r_amenities$和$r_trade_value$，并提高£mod_logistic_growth_mult£§Y人口增长速度§!和£mod_pop_happiness£§Y人口幸福度§!，如果可以开设§Y企业分部§!，还可以建造£building£§H夜雀食堂§!企业地产。\n\n每次升级该技能，£building£§H夜雀食堂§!的最高等级和§Y夜雀食堂员工§!的产出都会得到增强。"
 thl_leader_trait_jinx:0 "储存厄运程度的能力"
 thl_leader_trait_jinx_desc:0 "键山雏能够代替别人承受厄运，并将其收集起来，被收集的厄运则会成为她的力量。"
 thl_leader_trait_jinx_tooltip:0 "每当其他领袖将要获得随机§R负面特质§!时，阻止该特质的获取，并为§H键山雏§!提供§Y1§!点§G厄运储存§!，能够安全储存的厄运量等于§H键山雏§!的§Y等级§!，超过上限的§G厄运储存§!有概率泄露并使玩家承受§R负面事件§!。\n\n解锁诸多可用的§l符卡§!，§G厄运储存§!可以代替§HBOMB§!用以施放键山雏的§l符卡§!。\n\n当前键山雏拥有§Y[owner.jinx_stockpile]§!点§G厄运储存§!。"
 thl_leader_trait_kendo:0 "使用剑术程度的能力"
 thl_leader_trait_kendo_desc:0 "尽管冷兵器的时代已经过去，但这名领袖依旧可以率领超高速突击部队像剑一样切开敌人的阵线，打击毫无防备的后方。"
 thl_leader_trait_kendo_effect:0 "$ARMY_EFFECTS_TXT$：\n消灭敌方部队时：\n$t$连带消灭一支非前线部队的概率：§Y33%§!"
 thl_leader_trait_knowledge:0 "不动的大图书馆"
 thl_leader_trait_knowledge_desc:0 "这位领袖将数百年的人生大部分花在了阅读上，拥有极其渊博的知识，并愿意向我们分享这些知识。"
 thl_leader_trait_knowledge_effect:0 "允许建造£building£§H魔法图书馆§!建筑，提供大量$r_research$以及£job_fe_archivist£§Y$job_fe_archivist_plural$§!岗位，限§Y1§!座。"
 thl_leader_trait_kongfu:0 "使用气程度的能力"
 thl_leader_trait_kongfu_desc:0 "这位领袖可以运用气使出许多惊人的武学，并将其传授给我们的士兵。"
 thl_leader_trait_like_cloud_and_water:0 "行云流水"
 thl_leader_trait_like_cloud_and_water_desc:0 "这位领袖在战斗中总是一副冷静、深藏不露的样子，喜欢利用跟踪武器组成阵型将对手束缚然后再慢慢绞杀。"
 thl_leader_trait_like_cloud_and_water_effect:0 "$t$§I敌方舰队将无法从与该领袖的战斗中逃跑。§!"
 thl_leader_trait_like_storm_and_wave:0 "疾风怒涛"
 thl_leader_trait_like_storm_and_wave_desc:0 "这位领袖推崇大炮巨舰，认为战斗的关键在于一开始就以最强的火力歼灭敌人，以迅速取得胜利。"
 thl_leader_trait_like_storm_and_wave_effect:0 "$t$接战后的前30天：\n$tt$舰船武器射程：§G+50%§!\n$tt$舰船武器射速：§G+50%§!\n$tt$舰船武器伤害：§G+50%§!"
 thl_leader_trait_luck:0 "赋予幸运程度的能力"
 thl_leader_trait_luck_desc:0 "因幡帝的别名是幸运的白兔，据说见到她的人能得到幸运。"
 thl_leader_trait_magic:0 "使用魔法程度的能力"
 thl_leader_trait_magic_desc:0 "这位领袖经过刻苦的努力掌握了华丽且火力高强的魔法，可以用来强化其舰队武器。"
 thl_leader_trait_magician:0 "魔法使"
 thl_leader_trait_magician_desc:0 "这位领袖拥有使用魔法的能力。"
 thl_leader_trait_master_sacker:0 "洗劫大师（Master Sacker）"
 thl_leader_trait_master_sacker_desc:0 "这位领袖会使用一切手段借到自己要借的东西。"
 thl_leader_trait_master_sacker_effect:0 "战争胜利时，获得对手的一件遗珍，允许使用§Y夺宝奇兵§!战争借口，用该战争借口赢得战争会获得对方全部的遗珍。"
 thl_leader_trait_memory:0 "求问持的能力"
 thl_leader_trait_memory_desc:0 "这位领袖无论是看过的事，还是听过的事，都不会遗忘，这一能力在编集书物时大有用处。"
 thl_leader_trait_memory_effect:0 "允许建造£building£§Y国家历史档案馆§!，这一建筑会按照帝国规模提供§Y史官§!岗位，产出根据已完成飞升数成倍增长的$r_unity$、$r_society$和£minor_artifacts£§Y$minor_artifacts$§!，并提高全国的$planet_civilians_unity_produces_add$。"
 thl_leader_trait_mind_reader:0 "读心程度的能力"
 thl_leader_trait_mind_reader_desc:0 "这位领袖可以轻松读出别人心中所想乃至他们的记忆。"
 thl_leader_trait_miracle:0 "引发奇迹程度的能力"
 thl_leader_trait_miracle_desc:0 "这位领袖可以通过特定的仪式引发低概率事件。"
 thl_leader_trait_miracle_effect:0 "\n将§Y官僚§!建筑替换为§Y寺庙§!，允许在国内建造£building£ §Y守矢分社§!，通过星球决议，£building£§Y守矢分社§!可以在吸引/排斥/不干预风暴之间切换。\n允许使用§Y灰色奇术§!法令，以消耗£unity£凝聚力为代价在国内生成一个随机的§Y异常现象§!或触发一个稀有的§Y殖民地事件§!。\n允许科研船操纵恒星系内的一颗恒星来制造一场§Y宇宙风暴§!，等同于§Y星系天气控制§!飞升的效果。\n\n$EMPIRE_EFFECTS_TXT$：\n$t$可使用特殊的§c奇迹§!决议，以£unity£凝聚力为代价提供星球增益。\n\n$FLEET_EFFECTS_TXT$：\n$t$太空战斗开始时：\n$tt$将§B穿透现实§!以为星系内所有友方舰队提供§Y60§!天的随机§G战斗优势§!。\n\n$ARMY_EFFECTS_TXT$：\n$t$地面战斗开始时：\n$tt$星球上每§Y50§!个£pop£§Y唯心主义人口§!都会产生一队§Y守矢狂热者§!部队加入战斗，若该人口拥有§M灵能§!，将会产生更强的§Y守矢神选者§!。"
 thl_leader_trait_mirror:0 "天知 地知 我知 人知"
 thl_leader_trait_mirror_desc:0 "这位领袖的宝器使得一切罪恶都无所遁形，审判得以获得公正的裁决。"
 thl_leader_trait_mirror_effect:0 "\n解锁诸多可用的§l符卡§!。"
 thl_leader_trait_moon_war_veteran:0 "月战老兵"
 thl_leader_trait_moon_war_veteran_desc:0 "这位领袖接受过月之都的特种作战训练。"
 thl_leader_trait_no_fear_of_storm:0 "不惧风雨"
 thl_leader_trait_no_fear_of_storm_desc:0 "这位领袖百折不挠，敢于在如暴风骤雨般的恶劣条件下高歌自己的主题曲。"
 thl_leader_trait_nuclear:0 "操控核聚变程度的能力"
 thl_leader_trait_nuclear_desc:0 "八咫乌所拥有的究极力量，便是创造原子的力量，核聚变。核能，曾经留给未来的究极幻想，这股力量为阿空带来的是究极的火力，但其因力量过强常常难以控制。"
 thl_leader_trait_nuclear_effect:0 "\n$t$接战后每周：\n$tt$舰船武器伤害：§G+30%§!\n$tt$所受伤害：§R+10%§!\n\n允许使用§H地狱的人造太阳§!法令，消耗大量$r_energy$在战场上召唤§H人造太阳§!，其火力强大但仅能固定于一处。\n\n允许使用§H焰星「十凶星」§!法令，消耗大量$r_energy$在§H空§!的舰队中召唤§Y1§!颗§H焰星§!，§H焰星§!可跟随舰队作战但更为脆弱，至多可召唤§Y10§!颗。\n\n允许使用§HAbyss Nova§!法令，消耗巨量$r_energy$和少量$r_dark_matter$引爆§H空§!所在星系的恒星，§P无差别摧毁§!所有§Y星球§!、§Y空间站§!，并迫使§Y舰队§!进入任务中失踪状态。\n\n允许使用§H地狱极乐熔毁§!轰炸姿态，其拥有极其恐怖的破坏力，会将星球转化为§g废土星球§!甚至§P熔融星球§!。"
 thl_leader_trait_oni_power:0 "遗失的高贵之力"
 thl_leader_trait_oni_power_desc:0 "这位领袖是大名鼎鼎的鬼族四天王之一，拥有移山填海的伟力，她的名望吸引着银河间出色的战士，让他们拿起武器加入我们的事业。"
 thl_leader_trait_oni_power_effect:0 "可以在管理的星区或星球招募强大的§Y鬼族雇佣兵§!。\n\n$FLEET_EFFECTS_TXT$：\n$t$允许使用§Y掠夺§!轰炸姿态。\n\n$ARMY_EFFECTS_TXT$：\n$t$地面战斗每经过§Y10§!天：\n$tt$亲自击杀一支敌对陆军的概率：§Y30%§!"
 thl_leader_trait_optical_camouflage:0 "光学迷彩"
 thl_leader_trait_optical_camouflage_desc:0 "河城荷取的若干发明之一，通过采集周围环境的光学信息，改变自身的成像状态，从而达成与周边环境融为一体的隐形效果。这一系统和她自己的科研船适配最好，但我们也可以尝试着将它用在我们其他的舰船上。"
 thl_leader_trait_penglai_medicine:0 "蓬莱药局"
 thl_leader_trait_penglai_medicine_desc:0 "这位领袖供职于蓬莱药局，代表其向我们的公民推销先进的医疗服务，其中包括一些效果未经验证的实验疗法。"
 thl_leader_trait_personal_relationship_genius:0 "个人关系鬼才"
 thl_leader_trait_personal_relationship_genius_desc:0 "这位领袖擅长游走于多个彼此矛盾重重的对象之间，并同时与她们保持暧昧关系。"
 thl_leader_trait_price_of_life:0 "死是死者失 生是生者得"
 thl_leader_trait_price_of_life_desc:0 "这位领袖对生命的价值有一套独特的衡量标准。"
 thl_leader_trait_price_of_life_effect:0 "解锁§Y八重雾中渡§!轰炸姿态，将§Y人口§!炸成§H怨灵§!后绑架至我方星球，同时获得§Y100§!×§Y人口政治权利§!的$r_energy$，§H怨灵§!£pop£§Y人口§!无需维护费用且占用的£housing£§Y住房§!减半，但不擅长生产$r_minerals$和$r_food$。"
 thl_leader_trait_prosperity_and_decline:0 "荣枯盛衰"
 thl_leader_trait_prosperity_and_decline_desc:0 "这位领袖为我们带来了永远亭的极度先进的生物科学技术，大部分超出了我们的认知。"
 thl_leader_trait_prosperity_and_decline_effect:0 "解锁§Y瓦斯织物之玉§!和§Y国士无双之药§!法令，允许我们消耗$r_exotic_gases$使用蓬莱药局提供的§P非常规战术§!。"
 thl_leader_trait_puppet_show:0 "少女文乐"
 thl_leader_trait_puppet_show_desc:0 "这位领袖精于人偶剧的创作，并将表演人偶剧作为与大众建立联系和检验自己的人偶操纵技术的方式。"
 thl_leader_trait_rabbit_leader:0 "地上兔的领袖"
 thl_leader_trait_rabbit_leader_desc:0 "因幡帝是地上兔子和妖怪兔的领袖，她的领导能力使得她的族人能够在异乡安居乐业。"
 thl_leader_trait_rabbit_spy:0 "狡兔三窟"
 thl_leader_trait_rabbit_spy_desc:0 "对于狡诈而富有商业头脑的因幡帝，情报不过是又一种可以交易的商品。她手下的兔子非常乐意为她搜集情报，以换取更多的利益。"
 thl_leader_trait_rabbit_spy_tooltip:0 "可以在§Y法令§!中，向因幡帝购买其他国家的§Y情报§!，商品中偶尔还会包含§r意外惊喜§!。"
 thl_leader_trait_regeneration:0 "再生"
 thl_leader_trait_regeneration_desc:0 "这位领袖拥有强大的再生能力，即使身受致命伤依然可以恢复。"
 thl_leader_trait_relativistic_psychiatry:0 "专长：相对性心理学"
 thl_leader_trait_relativistic_psychiatry_desc:0 "这位领袖在科学世纪——一个学术水平极度先进的社会完成了相对性心理学的系统性学习。"
 thl_leader_trait_robotist_sanae:0 "巨型机器狂热者"
 thl_leader_trait_robotist_sanae_desc:0 "这位领袖会不计代价的把机器人造的更大，更强，更华丽。"
 thl_leader_trait_sakura:0 "幽雅地绽放吧，墨染的樱花"
 thl_leader_trait_sakura_1:0 "反魂蝶 -一分咲-"
 thl_leader_trait_sakura_1_desc:0 "随着西行妖的枝干开始绽放出花朵，这位领袖夺取生命的能力也在增强。"
 thl_leader_trait_sakura_3:0 "反魂蝶 -三分咲-"
 thl_leader_trait_sakura_3_desc:0 "西行妖不断地吸引人前来死亡，其封印逐渐淡薄，这位领袖的力量随之越发强大。"
 thl_leader_trait_sakura_5:0 "反魂蝶 -五分咲-"
 thl_leader_trait_sakura_5_desc:0 "西行妖的盛开进度已达一半，现在这位领袖操纵死亡的能力达到了空前的境界。"
 thl_leader_trait_sakura_8:0 "反魂蝶 -八分咲-"
 thl_leader_trait_sakura_8_desc:0 "西行妖几乎就要完全盛开了，然而其所在星球的春度已被榨干，看起来这就是极限。"
 thl_leader_trait_sakura_desc:0 "这位领袖携带着妖异的樱花树——西行妖的枝干，此物或与其能力存在着某种联系。"
 thl_leader_trait_sakura_effect:0 "允许在一个§G湿润§!气候的星球星球种下§M西行妖§!，这棵妖异的樱花树会产出大量§E灵魂§!资源并为星球上的§H灵体§!£pop£§Y人口§!提供劳动力增益，星球会逐步被吸收春度，变得§E寒冷§!，并最终成为独特的§M净土星球§!，随着樱花生长，幽幽子的技能也将得到强化。"
 thl_leader_trait_sanae_phase0:0 "孤陋浅薄的人类"
 thl_leader_trait_sanae_phase0_desc:0 "你的名字无人知晓，你的未来前途无量。"
 thl_leader_trait_satori_pets:0 "觉的动物朋友们"
 thl_leader_trait_satori_pets_desc:0 "这位领袖十分擅长管理宠物——或者说部下，可以大胆放心的让他们自己行动，同时也热衷于收集新的宠物。"
 thl_leader_trait_satori_pets_effect:0 "解锁§Y沟通动物§!决议，可以在星球上立刻发现一种新的§Y未开智动物§!。"
 thl_leader_trait_sermon:0 "德之说示"
 thl_leader_trait_sermon_desc:0 "这位领袖在她所管辖的星球四处巡游进行说教，使不同身份的居民都尽自己的本分。"
 thl_leader_trait_short_life:0 "转生之术的代价"
 thl_leader_trait_short_life_desc:0 "这位领袖的身体无法长期负担转世带来的负担，她很可能活不过30岁。"
 thl_leader_trait_sick:0 "病弱"
 thl_leader_trait_sick_desc:0 "这位领袖的身体不适合进行太空探索或考古发掘之类的工作。"
 thl_leader_trait_sleeping_terror:0 "沉睡的恐怖"
 thl_leader_trait_sleeping_terror_commander:0 "东方的恶魔"
 thl_leader_trait_sleeping_terror_commander_desc:0 "这位领袖通过散布恐惧和折磨敌人的精神成为了战场的绝对主宰。"
 thl_leader_trait_sleeping_terror_commander_effect:0 "接战后的敌方舰队在前30天：\n舰船武器射速：§R-25%§!\n舰船武器射程：§R-25%§!\n若战力低于幽香的舰队：\n舰船武器射速：§R-75%§!\n舰船武器射程：§R-75%§!"
 thl_leader_trait_sleeping_terror_desc:0 "这位领袖丝毫不会有恐惧感，且非常喜欢折磨人的精神，所幸她对于不够强的生灵不感兴趣。"
 thl_leader_trait_sleeping_terror_effect:0 "当§R值得一战的对手§!出现时，这位领袖会觉醒成为一个§Y10§!级§H舰队司令§!。"
 thl_leader_trait_song:0 "用歌声迷惑人程度的能力"
 thl_leader_trait_song_desc:0 "夜雀的歌声能够使生物的判断神经变得迟钝，被黑暗迷惑的人将就此消失于黑暗中。"
 thl_leader_trait_song_tooltip:0 "\n接战后的敌方舰队前30天：\n舰船武器射程：§R-50%§!\n命中：§R-50%§!\n闪避：§R-50%§!"
 thl_leader_trait_speculative_fiction:0 "这也全是妖怪干的吗？"
 thl_leader_trait_speculative_fiction_desc:0 "这位领袖会利用业余时间写作推理小说，她善于根据读者对作品的思路进行设计，使得她的作品几乎被所有文明的住民所接受。"
 thl_leader_trait_star_located:0 "观测天体便能得知时间与方位的能力"
 thl_leader_trait_star_located_desc:0 "这位领袖能够看到这个世界的构造。"
 thl_leader_trait_subconscious:0 "操纵无意识的程度的能力"
 thl_leader_trait_subconscious_desc:0 "这位领袖没有内心，也没有欲望。"
 thl_leader_trait_subconscious_effect:0 "\n解锁诸多可用的§r符卡§!。"
 thl_leader_trait_subterran_manager:0 "怨灵也为之惧怯的少女"
 thl_leader_trait_subterran_manager_desc:0 "管理灼热地狱遗址的经验使得这位领袖精通地下城市的规划，和对待怨灵的办法。"
 thl_leader_trait_subterran_manager_effect:0 "解锁§Y地下区划规划§!决议，为觉管理的星球提供额外的 £district£ §Y区划上限§!与§Y可开发资源§!。"
 thl_leader_trait_summon_devils:0 "彼方的召唤"
 thl_leader_trait_summon_devils_desc:0 "这位领袖召唤使魔为自己服务。"
 thl_leader_trait_summon_devils_effect:0 "在管理的星球允许§Y恶魔之门§!和§Y彼方的召唤§!星球决议，消耗大量$r_zro$生成§Y4~10§!个§H恶魔§!£pops£人口。"
 thl_leader_trait_super_unified_physics:0 "专长：超统一物理学"
 thl_leader_trait_super_unified_physics_desc:0 "这位领袖在科学世纪——一个学术水平极度先进的社会完成了超统一物理学的系统性学习。"
 thl_leader_trait_super_youkai_slug:0 "超妖怪弹头"
 thl_leader_trait_super_youkai_slug_desc:0 "还有什么能比高精尖的武器装备更能体现河童的技术力呢？从简单的水泡弹，再到光子鱼雷到三平战斗机，一直到太古的尼斯湖水怪，河童科技的威力总能震撼人心！"
 thl_leader_trait_super_youkai_slug_effect_tier:0 "§G升级后可以允许你建造强大的陆军和海军单位。§!"
 thl_leader_trait_super_youkai_slug_effect_tier_2:0 "$ARMY_EFFECTS_TXT$:\n可以建造§Y3§!队战力极度恐怖的§Y尼斯湖水怪§!陆军，尤其擅长打击敌人士气。\n\n§G升级后可以允许你建造强大的海军单位。§!"
 thl_leader_trait_super_youkai_slug_effect_tier_3:0 "$ARMY_EFFECTS_TXT$:\n可以建造§Y3§!队战力极度恐怖的§Y尼斯湖水怪§!陆军，尤其擅长打击敌人士气。\n\n$FLEET_EFFECTS_TXT$:\n可以建造§Y10§!只§Y仿生水龙§!，拥有类似天龙幼崽的战斗力。"
 thl_leader_trait_synth_life:0 "意识矩阵"
 thl_leader_trait_synth_life_desc:0 "这位领袖通过将自身的意识上传到了一个分布式网络中实现了永生。"
 thl_leader_trait_the_ninth_savage:0 "第九代学者"
 thl_leader_trait_the_ninth_savage_desc:0 "这位领袖虽然失去了转生后过去的大部分记忆，但千年间的积累依然使得她的知识与经验远超常人。"
 thl_leader_trait_the_ninth_savage_effect:0 "该特质的加成会随等级增长而成倍提高。"
 thl_leader_trait_theurgist:0 "通神者"
 thl_leader_trait_theurgist_desc:0 "这位领袖可以毫无障碍的与更高位面的存在沟通，并从那些存在之处借来力量。"
 thl_leader_trait_time:0 "操控时间程度的能力"
 thl_leader_trait_time_desc:0 "这位领袖可以自如地对时间和空间进行操纵。"
 thl_leader_trait_time_effect:0 "$PLANET_EFFECTS_TXT$:\n$t$解锁§Y空虚「Inflation Square」§!星球决议，以增加各项行动的§Y时间消耗§!为代价提高 £district£ §Y区划上限§!。\n\n$FLEET_EFFECTS_TXT$:\n$t$解锁§Y时符「Private Square」§!法令，在短时间内大幅增加友方舰队的§Y速度§!、§Y命中§!和§Y射速§!并降低敌人舰队的§Y速度§!、§Y闪避§!和§Y射速§!。\n$t$解锁§Y「咲夜的世界」§!法令，短暂停止星系内所有敌人舰队的时间，使他们的§Y速度§!、§Y闪避§!和§Y射速§!降为§R0§!。\n\n$ARMY_EFFECTS_TXT$:\n$t$解锁§Y幻符「杀人玩偶」§!法令，§Y瞬时随机击杀§!多队正在与自己交战的敌对陆军，击杀数上限取决于§Y等级§!。"
 thl_leader_trait_tracker:0 "犯规索敌者"
 thl_leader_trait_tracker_desc:0 "这位领袖的攻击具有惊人的准确性，这要归功于她的超强运气和直觉。"
 thl_leader_trait_trial:0 "判断是非黑白程度的能力"
 thl_leader_trait_trial_desc:0 "这位领袖精通自然法，不仅在她管辖的范围内做出公正的审判，还推动我国法律体制向更健全的方向发展。"
 thl_leader_trait_trial_effect:0 "解锁§Y根除犯罪§!决议，消耗$r_unity$和$r_energy$清除一个星球的§Y犯罪修正§!或§Y犯罪集团分部§!"
 thl_leader_trait_water:0 "操纵水程度的能力"
 thl_leader_trait_water_desc:0 "水是孕育文明的源泉，亦是每个文明使用的最初的动力。从水下第一个生命的萌芽到实验室的基因操纵，从昆虫细小的肢体到重型液压机械，从推动磨坊的水车到反应堆的蒸汽轮机，水——这一最平平无奇而又最奇妙多变的物质，见证了每一个文明的繁荣与进步。"
 thl_leader_trait_water_effect:0 "§Y星球加成仅在管理潮湿星球时生效，在管理海洋星球时效果加倍。§!"
 thl_leader_trait_wave_length:0 "操纵波长程度的能力"
 thl_leader_trait_wave_length_desc:0 "这位领袖可以操控包括光波、声波、空间的波、构成物质和生物的波、构成生物的思考和感情的波在内的波的波长、振幅、相位，达到使人变轻松或疯狂、让存在过剩或稀薄、使事物无法被触碰甚至外形完全消失等多样的效果。"
 thl_leader_trait_wave_length_effect:0 "$ARMY_EFFECTS_TXT$：\n$t$开战前产生§Y3~12§!队在战后就会消失，几乎无攻击能力，但士气打击能力良好的§M幻象§!陆军。\n$t$地面战斗每经过§Y10§!天：\n$tt$使一支敌对陆军转换立场的概率：§Y15%§!\n\n$FLEET_EFFECTS_TXT$：\n$t$接战后的敌对舰队每周：\n$tt$闪避：§R-5§!\n$tt$命中：§R-5§!\n$tt$索敌：§R-5§!"
 thl_leader_trait_wind:0 "操纵风程度的能力"
 thl_leader_trait_wind_desc:0 "这位领袖可以操纵星际物质流或制造风暴。"
 thl_leader_trait_wind_effect:0 "允许科研船操纵恒星系内的一颗恒星来制造一场§Y宇宙风暴§!，等同于§Y星系天气控制§!飞升的效果。\n\n解锁§Y天之八衢§!恒星基地建筑，在星系内产生§Y天狗风暴§!，§R无效化§!所有§Y护盾§!和§Y探测器§!，降低全体§Y命中§!和§Y射速§!，提高星系内我方舰队的§Y舰船速度§!，降低§Y超空间跳跃冷却§!，降低敌方§Y舰船速度§!，降低§Y紧急超光速脱离§!几率，并对该恒星系内的§Y敌对舰船§!造成持续伤害。"
 thl_leader_trait_words:0 "可以读懂任何文字程度的能力"
 thl_leader_trait_words_desc:0 "这位领袖可以阅读一切的文字，包括已经消亡的古代文明或是完全陌生的外星文明，甚至加密的文字。"
 thl_leader_trait_words_effect:0 "§E拥有该领袖时§!：\n解锁§H解读先驱者秘密§!文物行动，可以消耗大量稀有文物获得一项§Y先驱者秘密§!科技。\n完成一个考古发掘阶段时，获得等同于§Y6§!个月产出的随机类型$r_research$。"
 thl_leader_trait_year_round:0 "快刀乱麻"
 thl_leader_trait_year_round_desc:0 "这位领袖使用她几乎无穷无尽的时间亲自处理各式各样的工作。"
 thl_leader_trait_youkai_punk:0 "妖怪朋克"
 thl_leader_trait_youkai_punk_desc:0 "与传说中对妖怪歌声的刻板印象不同，米斯蒂娅的歌声激烈而吵闹，这一尽情宣泄内心情感的音乐风格深受年轻人的欢迎，并出现了模仿的浪潮以用这一音乐题材表达年轻一代对社会的观点。"
 thl_leader_trait_yuyuko_eater:0 "幽幽子的一盘一口"
 thl_leader_trait_yuyuko_eater_desc:0 "这位领袖已然逝去，故其食欲永远不会得到满足。"
 thl_thl_leader_trait_death_deal:0 "有钱能使鬼推磨"
 thl_thl_leader_trait_death_deal_desc:0 "这位领袖在彼岸的关系网使得她可以进行不那么光彩的交易以给死者一个机会。"
 thl_thl_leader_trait_death_deal_effect:0 "当任一§H领袖§!死亡时：\n可以消耗§Y2000§!×§H领袖等级§!的$r_energy$免除这次死亡并提供§Y20§!年的额外寿命，一个领袖§P仅限一次§!。"
 touhou_paragon_enclave.305.a:0 "我们想要§Y雇佣一些技术移民§!。"
 touhou_paragon_enclave.305.b:0 "有想获得更好薪资待遇的§Y科研人员§!吗？"
 touhou_paragon_enclave.305.c:0 "给我们说说§Y河童扩展船坞§!建筑吧。"
 touhou_paragon_enclave.305.d:0 "你们能在§Y建造§!方面援助我们吗？"
 touhou_paragon_enclave.305.desc.hostile:0 "你好啊，你是来帮我们实验最新的光子鱼雷的吗？\n\n什么？听不见！我发射了哦……欸？你还没死啊？还不快滚！"
 touhou_paragon_enclave.305.desc.scavenger_first:0 "感谢你，盟友！根据《妖怪之山互助协议》，你们已经被列入白名单。没有你们的帮助，这座空间站恐怕又要陷入好几天的停电。技术问题还在其次，不过没有你们的工程管理人员，那些争吵不休的技术团队恐怕会把这里搞炸好几次。\n\n我们是河童轨道开发集团，我是首席发言人§C$NAME_Nitori$§!。河童是精通于工程与技术的种族，向您提供优质的工程项目服务。\n我们为了争夺专利打过好几次河底大战争，最严重的一次沉船的残骸把玄武川堵上了，我们只好被迫去探索星系，最终在这里找到了一片丰富的水源。我们曾经尝试过登陆行星，但是行星上缺乏陆地、磁场过强以及容易受到中子辐射的干扰，我们的工程师们只好设计了空间站在此定居。\n\n如果需要购买新开发的机器人请前往这个区域，如果想要和我们最杰出的科学家进行技术交流请前往那个区域……哎呀，这里是秘密区域，事关整个集团的命脉，不过如果是你们的话，可以破例参观。\n\n是的是的！这片水培黄瓜农场可是这个空间站技术含量最高的地方！"
 touhou_paragon_enclave.305.desc.scavenger_visit:0 "§Y河童轨道开发集团§!由幻想乡的河童合资建立，面向银河全体国家服务。我们主营的业务范围包括机器人展销和工程建设项目服务，同时也代运营幻想乡玄武川全部河童企业在本银河系的业务。购买机器人请前往A区，请求技术员支持请前往B区，联系其他河童总部请使用这个终端，工程项目合作请上三楼CEO办公室面谈。\n\n另外请注意，这个空间站受到我们盟友§Y[patron_country.GetName]§!的保护，任何敌对行为都将视为公开的宣战。"
 touhou_paragon_enclave.305.e:0 "听说你们的§Y机器人制造§!技术冠绝天下。"
 touhou_paragon_enclave.305.g:0 "我听说§Y非想天则§!是你们建造的？"
 touhou_paragon_enclave.305.h:0 "我可以请水中的工程师§Y河城荷取§!担任我国顾问吗？"
 touhou_paragon_enclave.305.name:0 "河童轨道开发集团"
 touhou_paragon_enclave.310.a:0 "让我们签订相关条款吧"
 touhou_paragon_enclave.310.b:0 "看看你们还有什么服务内容"
 touhou_paragon_enclave.310.desc.no.slave:0 "没问题盟友，我们正好有一批期望获得更高薪资的河童技术移民，但是您必须保证给予她们完整公民权和一定的福利待遇。另外，我们可能需要一笔手续费，最好是通过工程资源赞助的方式……"
 touhou_paragon_enclave.310.desc.slave:0 "这恐怕不行，我们的社会观察员注意到贵国允许一定程度的奴隶制。我们无法承担风险去签订这样的移民项目，您必须保证给予她们完整公民权。"
 touhou_paragon_enclave.310.name:0 "河童轨道开发集团：技术移民项目"
 touhou_paragon_enclave.320.a:0 "成交"
 touhou_paragon_enclave.320.desc:0 "让我思考一下……我们的技术人员是很宝贵的，但签订派遣合同也合理合法。您可能需要支付一笔赞助费，以及为她们开具体面的薪资。最重要的是，您要确保她们的人身安全。"
 touhou_paragon_enclave.320.name:0 "河童轨道开发集团：科学家派遣项目"
 touhou_paragon_enclave.330.a:0 "你确定黄瓜不是用来吃的，而是用来“用”的吗？"
 touhou_paragon_enclave.330.b:0 "分享我国的有机催化技术将有利于技术进步"
 touhou_paragon_enclave.330.desc:0 "没错！来看看河童轨道开发集团最有价值的新发明——河童扩展船坞！这真是一个令人激动的研发项目，它可以通过有机催化机制完成合金的可塑化再生产，从而极大程度地扩展恒星基地上的船坞效率。没错，你甚至可以收获一些额外的有机产品，比如一些葫芦科植物？\n\n当然我们需要收取这种技术的专利费，你可以用一些可用于此的有机植物种子来交付，又或者可以分享一下关于催化加工的先进技术？"
 touhou_paragon_enclave.330.name:0 "河童轨道开发集团：河童扩展船坞项目"
 touhou_paragon_enclave.340.a:0 "成交！希望我们的合作效率越来越高。"
 touhou_paragon_enclave.340.desc:0 "交给我们吧！河童重工建设有限公司会帮助您的工程建设工作，相信我们之间的合作效率会不断提升！"
 touhou_paragon_enclave.340.name:0 "河童轨道开发集团：河童重工建设有限公司"
 touhou_paragon_enclave.341.a:0 "成交！希望我们的合作效率越来越高。"
 touhou_paragon_enclave.341.b:0 "这次先算了吧，我们需要重新规划政府预算。"
 touhou_paragon_enclave.341.desc:0 "嘿我亲爱的盟友！河童重工建设有限公司近期又要接新的项目啦，之前我们的合作相当顺利不是吗？\n我想，您一定还需要我们的工程建设团队，我们再来签订一份合同怎样？"
 touhou_paragon_enclave.350.a:0 "来一批样机看看？"
 touhou_paragon_enclave.350.b:0 "我要订购一整套生产线！"
 touhou_paragon_enclave.350.desc:0 "河童非想天则有限公司致力于提供工业机器人、人形机器人、人工智能生命体、义体改装、自动化人偶等产品与服务。来订购一款最新型号的样品机怎样？"
 touhou_paragon_enclave.350.name:0 "河童轨道开发集团：河童非想天则有限公司"
 touhou_paragon_enclave.351.a:0 "付款吧，我们需要高速运转的生产线。"
 touhou_paragon_enclave.351.b:0 "感觉国库被掏空，不买了！"
 touhou_paragon_enclave.351.desc:0 "河童非想天则有限公司为您授权的河童机器人高效生产线使用许可已经到期了，如果想要继续使用的话，需要续费购买许可哦。"
 touhou_paragon_enclave.360.a:0 "可以订制一台非想天则的初号机样品吗？"
 touhou_paragon_enclave.360.b:0 "好消息各位！我们从§G东风谷早苗§!那里获得了量产方案！"
 touhou_paragon_enclave.360.desc:0 "河童非想天则有限公司以初号机非想天则命名，那曾是我们在妖怪之山时受山神所托制造的大型人形机器人。\n然而随着技术进步，机器人逐渐往单元化、小型化、智能化发展，非想天则也被遗忘在历史中了。\n\n当然，似乎仍有少数人信仰着这种“高达”机器人，所幸我们保留了非想天则的设计图纸，但如何对其量产并应用始终毫无头绪。"
 touhou_paragon_enclave.360.name:0 "河童轨道开发集团：非想天则大型人形机器人项目"
 touhou_paragon_enclave.370.a:0 "太妙了！你在尝试一种很新的工作方法"
 touhou_paragon_enclave.370.b:0 "恐怕我们内部需要重新讨论一下远程办公的可能性。"
 touhou_paragon_enclave.370.desc:0 "哦我亲爱的盟友，你的意思是说……希望我到贵国担任科研顾问？\n我恐怕不能放弃在河童轨道开发集团的职务，这太……等一下，或许我可以用这个……\n\n当当当当！新研发的带有实体触感功能的全息投影设备，简直可以复制一个我自己出来！\nDouble Time, Double Pay!"
 touhou_paragon_enclave.370.name:0 "河童轨道开发集团：§C河城荷取§!的新工作？"
 touhou_paragon_enclave.382.desc.destoryed:0 "位于[old_kappa_enclave_system.GetName]的河童轨道开发集团的基地最近被摧毁了，并没有任何消息证明有河童成功逃生。"
 touhou_paragon_enclave.382.desc.saved:0 "位于[old_kappa_enclave_system.GetName]的河童轨道开发集团的基地最近被摧毁了，但据说相当数量的河童，包括他们的领袖§C$NAME_Nitori$§!，都已经通过紧急逃生舱撤离了。"
 touhou_paragon_enclave.383.a:0 "当然，我们会为你提供保护。"
 touhou_paragon_enclave.383.a_tooltip:0 "[kappa_enclave_new_system.GetName]星系中将重建河童城邦。"
 touhou_paragon_enclave.383.b:0 "对不起，我们之间还没有建立良好的信任。"
 touhou_paragon_enclave.383.b.reply:0 "可是我们还能去哪里呢？"
 touhou_paragon_enclave.383.desc:0 "喂？能听见吗？\n\n太好了我亲爱的盟友。玄武之星目前遭到了野蛮袭击，他们一点都不尊重先进技术和自由市场！凶手以为我们已经死了，但正如在河底大战争中一样，吸取以往经验的河童们早就提前准备了逃生艇，相当一部分的成员们都活下来了。\n\n我们希望在[kappa_enclave_new_system.GetName]星系内重新开展活动，因为这里有我们宝贵的水资源。当然，我们只是在那里重建我们的潮涌居住站，星系的控制权还是盟友您的。"
 touhou_paragon_enclave.40600.a:0 "适当的供奉总是不会出错。"
 touhou_paragon_enclave.40600.b:0 "我们将取悦那未知的神明。"
 touhou_paragon_enclave.40600.c:0 "我们将探索其中的因果律。"
 touhou_paragon_enclave.40600.d:0 "下次再说。"
 touhou_paragon_enclave.40600.desc:0 "我们来到了神社的§H赛钱箱§!前，一根超导电缆从它的底部通往地底。\n显然，这里是收取香火的地方。"
 touhou_paragon_enclave.40600.e:0 "以灵梦为媒介与她的神灵们沟通。"
 touhou_paragon_enclave.40605.1.desc:0 "非其所祭而祭之，名曰淫祀。淫祀无福。"
 touhou_paragon_enclave.40605.2.desc:0 "祭如在，祭神如神在。"
 touhou_paragon_enclave.40605.3.desc:0 "与其媚于奥，宁媚于灶。"
 touhou_paragon_enclave.40605.4.desc:0 "未能事人，焉能事鬼。"
 touhou_paragon_enclave.40605.5.desc:0 "务民之义，敬鬼神而远之，可谓知矣。"
 touhou_paragon_enclave.40605.a:0 "供奉100能量币£energy£"
 touhou_paragon_enclave.40605.b:0 "供奉1000能量币£energy£"
 touhou_paragon_enclave.40605.c:0 "供奉10000能量币£energy£"
 touhou_paragon_enclave.40605.d:0 "供奉100000能量币£energy£"
 touhou_paragon_enclave.40605.e:0 "此事还需三思"
 touhou_paragon_enclave.40610.desc:0 "神迹显现！一些较小的神迹出现在了[Root.GetName]的各个角落。"
 touhou_paragon_enclave.40615.desc:0 "神迹显现！一些明显的神迹出现在了[Root.GetName]的各个角落。"
 touhou_paragon_enclave.40620.desc:0 "神迹显现！一些可观的神迹出现在了[Root.GetName]的各个角落。"
 touhou_paragon_enclave.40625.1.desc:0 "我们将借助灵梦为媒介与那些遥远的意识达成§R交易§!。\n\n那些所谓神明的实体与那些贪婪的行商没有本质不同。作为通神的媒介，灵梦的强欲将会随着我们的无尽欲望的增长与日俱增。\n\n§R控制欲念，切莫迷失自我。§!"
 touhou_paragon_enclave.40625.2.desc:0 "我们将借助灵梦为媒介与那些遥远的意识达成§Y协议§!。\n\n在我们眼中，神明或许是遥不可及的意识存在，祂们渴求着无尽的能量。\n\n我们的§Y协议§!或许应该足够谨慎。"
 touhou_paragon_enclave.40625.3.desc:0 "我们将借助灵梦为媒介与那些遥远的意识签订§G契约§!。\n\n虽然灵梦能够沟通的仅仅是神道传说中的灵能体，但能够以微小的代价换取祂们的信任，这亦是我们在哲学意义上的一次胜利。\n\n谁掌控了§G意识§!，谁就掌控了未来。"
 touhou_paragon_enclave.40625.a:0 "伊豆能売"
 touhou_paragon_enclave.40625.a.tooltip:0 "伊豆能売是消灾免祸之神，具有净化污秽之神力。\n\n§Y「人之生也直，罔之生也幸而免。」§!\n\n一名具有§Y普通§!负面特质的随机领袖将§G清空§!其负面特质。"
 touhou_paragon_enclave.40625.b:0 "住吉三神"
 touhou_paragon_enclave.40625.b.tooltip:0 "底筒之男命、中筒之男命、上筒之男命等三神并称为住吉三神，祂们是海神。\n\n§Y「上善若水，水善利万物而不争。」§!"
 touhou_paragon_enclave.40625.c:0 "弁才天"
 touhou_paragon_enclave.40625.c.tooltip:0 "弁才天原是佛教中的天女，在民俗中认为与市寸岛比卖命是同一神，如其名也主辩才。\n\n§Y「信言不美，美言不信。善者不辩，辩者不善。」§!"
 touhou_paragon_enclave.40625.d:0 "八意思兼"
 touhou_paragon_enclave.40625.d.tooltip:0 "八意思兼是掌管知识的神。\n\n§Y「吾非生而知之，敏而求之者也。」§!"
 touhou_paragon_enclave.40625.e:0 "菅原道真"
 touhou_paragon_enclave.40625.e.tooltip:0 "菅原道真是平安时代的学者，抑郁而终，后被尊为天满天神。\n\n§Y「朝闻道，夕死可矣。」§!"
 touhou_paragon_enclave.40625.f:0 "石凝姥命"
 touhou_paragon_enclave.40625.f.tooltip:0 "石凝姥命是锻冶、金属加工之神。\n\n§Y「工欲善其事，必先利其器。」§!"
 touhou_paragon_enclave.40625.g:0 "木花石长姬"
 touhou_paragon_enclave.40625.g.tooltip:0 "木花石长姬是生命之神，咲耶姬之姊。\n\n§Y「知者乐，仁者寿。」§!"
 touhou_paragon_enclave.40625.h:0 "天照大御神"
 touhou_paragon_enclave.40625.h.tooltip:0 "天照大御神，高天原之主，日神。\n\n§Y「人虽欲自绝，其何伤于日月乎。」§!"
 touhou_paragon_enclave.40625.i:0 "鬼子母神"
 touhou_paragon_enclave.40625.i.tooltip:0 "鬼子母神，佛教天女，婴孩之神。\n\n§Y「近之则不孙，远之则怨。」§!"
 touhou_paragon_enclave.40625.j:0 "菊理媛命"
 touhou_paragon_enclave.40625.j.tooltip:0 "菊理媛，结缘之神，象征关系调和。\n\n§Y「君子周而不比，小人比而不周。」§!"
 touhou_paragon_enclave.40625.k:0 "志那都比古"
 touhou_paragon_enclave.40625.k.tooltip:0 "志那都比古神，风神。\n\n§Y「是唯无作，作则万窍怒呺。」§!"
 touhou_paragon_enclave.40625.l:0 "惠比寿"
 touhou_paragon_enclave.40625.l.tooltip:0 "惠比寿，渔业之神，商业之神。\n\n§Y「虽不受命，而货殖焉，臆则屡中。」§!"
 touhou_paragon_enclave.40625.m:0 "金山彦命"
 touhou_paragon_enclave.40625.m.tooltip:0 "金山彦命，矿业之神，可化利刃为尘沙，亦可塑砂土为坚金。\n\n§Y「兵者，国之爪也。」§!"
 touhou_paragon_enclave.40625.n:0 "少彦名命"
 touhou_paragon_enclave.40625.n.tooltip:0 "少彦名命身形短小，却集智慧、商业与开拓于一身。\n\n§Y「善与人交，久而敬之。」§!"
 touhou_paragon_enclave.40625.o:0 "天手力雄神"
 touhou_paragon_enclave.40625.o.tooltip:0 "亦称天手力男神，运动之神。\n\n§Y「千乘之国，可使治其赋也。」§!"
 touhou_paragon_enclave.40625.p:0 "须佐之男"
 touhou_paragon_enclave.40625.p.tooltip:0 "须佐之男是伊邪那歧的第三子，性格暴虐无常，却又英武无比。曾斩八岐大蛇，夺草雉之剑。\n\n§Y「暴虎冯河，死而无悔。」§!"
 touhou_paragon_enclave.40625.q:0 "洗涤灵梦的欲念"
 touhou_paragon_enclave.40625.q.tooltip:0 "§Y苟子之不欲，虽赏之不窃。§!"
 touhou_paragon_enclave.40625.r:0 "再议吧"
 trait_kappa_aquatic:0 "水中的技师"
 trait_kappa_aquatic_desc:0 "河童是天生的水中的技师，她们擅长技术、崇尚科学、渴望自由"
 trait_kappa_aquatic_tooltip:0 "在潮湿气候星球或洪潮居住站上，£housing£住房需求减少10%。\n如果河童被奴役，£job£岗位生产的资源将§R减少1000%§!。"
 trait_scarlet_blood:0 "斯卡蕾特眷族"
 trait_scarlet_blood_desc:0 "这一物种接受了吸血鬼的血液并融入了他们的血脉，从而大大增强了其力量。"
 utsuho1:0 "生活在旧地狱的灼热地狱遗址的地狱鸦，被八坂神奈子选中而被八咫乌寄宿在体内。作为地狱鸦，她是个鸟脑袋，脑袋空空，十分健忘。这也是她体内能寄宿神灵的原因。"
 utsuho1_catch_phrase:0 "黑色的太阳，八咫乌尊，谢您赐我神力。倾泻在地上的太阳光芒，那是创造新原子的核聚变反应之热。究极的核聚变，将肉体与心灵与幽灵与妖精，全部融为一体吧！"
 youmu1:0 "原为冥界白玉楼的园艺师，在祖父魂魄妖忌归来接管其职务后，受其主人西行寺幽幽子的鼓动外出进行剑士的修行。"
 youmu1_catch_phrase:0 "妖怪所锻造的这把楼观剑，斩不断的东西——几乎不存在！"
 yuka1:0 "十分强大与危险的妖怪，与其说是花之妖怪更像是自然的化身。"
 yuka1_catch_phrase:0 "让花儿绽放，是土地的力量。所以，花儿从没忘怀开后回归土地。"
 yuyuko1:0 "冥界的主人，原居住于冥界中心的白玉楼，自称被香味和友人指引来此，但似乎实际的目的是使樱花树“西行妖”的枝干开花。"
 yuyuko1_catch_phrase:0 "亡骸就是要集中在一个地方，才会美丽哦～春和樱花也一样……"
 decision_atb_th_recruit_scientist:0 "招募幻想乡来客：科学家"
 decision_atb_th_recruit_scientist_desc:0 "据说银河的某处连着一片被结界隔开的土地。只要备足宴席所需的食物，那里的少女们或许愿意前来做客，甚至留下来。"
 decision_atb_th_recruit_scientist_tt:0 "随机招募一位尚未加入的§Y东方科学家§!，直到全部招到。"
 decision_atb_th_recruit_commander:0 "招募幻想乡来客：指挥官"
 decision_atb_th_recruit_commander_desc:0 "据说银河的某处连着一片被结界隔开的土地。只要备足宴席所需的食物，那里的少女们或许愿意前来做客，甚至留下来。"
 decision_atb_th_recruit_commander_tt:0 "随机招募一位尚未加入的§Y东方指挥官§!，直到全部招到。"
