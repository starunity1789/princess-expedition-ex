l_simp_chinese:
 # 皇女的远征军EX：合并进来的上游 MOD 在简体中文里缺的键（上游其他语言都有，只有中文漏了）。
 # GPM 改造政策与它引用的概念——改造政策决定改造完成后保留还是重掷行星修正，2.8 保留了它。
 policy_gpm_terraforming_policy:0 "改造方针"
 policy_gpm_terraforming_policy_desc:0 "这项政策决定我们执行星球改造时遵循的程序。\n"
 gpm_terraforming_policy_prestine_modifiers:0 "原貌改造"
 gpm_terraforming_roll_prestine_modifiers_name:0 "$gpm_terraforming_policy_prestine_modifiers$"
 gpm_terraforming_policy_prestine_modifiers_desc:0 "['concept_terraforming']时，我们的星球将保持原貌。\n\n§Y改造后§!的星球会清理其['concept_planet_modifiers']：不再符合改造后['concept_planet']类型的修正会被移除。§H奇观世界§!、§B先驱者§!这类特殊行星修正始终保留。\n\n§Y改造后§!的星球获得行星修正['concept_gpm_terraforming_world_engineering']，§R不会§!获得新的行星修正。\n\n"
 gpm_terraforming_policy_random_modifiers:0 "引导改造"
 gpm_terraforming_roll_random_modifiers_name:0 "$gpm_terraforming_policy_random_modifiers$"
 gpm_terraforming_policy_random_modifiers_desc:0 "['concept_terraforming']时，我们将引导星球的成长。\n\n§Y改造后§!的星球会清理其['concept_planet_modifiers']：不再符合改造后['concept_planet']类型的修正会被移除。§H奇观世界§!、§B先驱者§!这类特殊行星修正始终保留。\n\n§Y改造后§!的星球会获得§G新的§!随机§H改造专属§!行星修正，类型取决于星球的['concept_designation']。\n\n"
 concept_gpm_terraforming_world_engineering:0 "$gpm_terraforming_world_engineering$"
 concept_gpm_terraforming_world_engineering_desc:0 "- $MOD_PLANET_RESETTLEMENT_UNEMPLOYED_DESTINATION_MULT$：§G+50%§!\n- $mod_district_generator_max_add$：§G+2§!\n- $mod_district_mining_max_add$：§G+2§!\n- $mod_district_farming_max_add$：§G+2§!\n\n§L$gpm_terraforming_world_engineering_mod_desc$§!"
